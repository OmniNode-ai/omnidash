schema_version: "1.0.0"
ticket_id: "OMN-20074"
title: "omnidash leaves onex_change_control: contract-validation on omnibase_core, and the S6 cut-over of its OCC callers"
summary: "omnidash's contract-validation workflow validates the branch ticket's repo-local contract with omnibase_core's ModelTicketContract, installed at an exact pinned version, instead of checking out onex_change_control and running its composite validate-contract action. The workflow, job and context names are unchanged. A focused test runs the step's own run block over planted contracts and this repository's contracts. The S6 cut-over removes OCC callers and contexts and enforces repo-owned evidence without comparing with OCC."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-contract-validation-core-validator"
    statement: |-
      omnidash's contract-validation workflow validates the branch ticket's contract with omnibase_core's ModelTicketContract at an exact pinned version, reads nothing from onex_change_control, and keeps its workflow, job and context names.
    acceptance:
      - id: "AC9"
        statement: |-
          AC9: .github/workflows/contract-validation.yml names no onex_change_control (no checkout, no composite action, no validate-yaml), installs omnibase_core at one exact version no older than 0.47.39 for both the validation step and its test, and keeps its workflow name Contract Validation, its job name contract-validation and its required-checks row -- falsifier: uv run --no-project --python 3.12 --with omnibase-core==0.47.39 --with pyyaml --with pytest python -m pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null -k "test_workflow_ or test_required_check or test_omnibase_core_is_installed"
      - id: "AC10"
        statement: |-
          AC10: the contract-validation step's own run block, run over this repository's contracts, passes the branch ticket's contract and every contracts/OMN-*.yaml, skips a branch with no ticket or no contract, and fails a planted binds_ac entry that is not a criterion label, a planted binds_ac item of check_type command_exit_0, a contract missing a required field and an unparseable contract, each naming the file and the reason -- falsifier: uv run --no-project --python 3.12 --with omnibase-core==0.47.39 --with pyyaml --with pytest python -m pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null
  - id: "req-s6-cutover-no-occ-callers"
    statement: |-
      omnidash retires its OCC callers and contexts and enforces repo-owned evidence without comparing with OCC.
    acceptance:
      - id: "AC11"
        statement: |-
          AC11: no workflow calls an OCC reusable or waits on occ-preflight, the five OCC caller workflows and scripts/ci/occ_manual_replay_precheck.py are gone, call-reject-skip.yml pins reject-deploy-gate-skip.yml@4358450ccbba0cee11e390208dd0b8b1728e94ab, and required-checks.yaml names no OCC context -- falsifier: uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_no_occ_callers_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null
      - id: "AC12"
        statement: |-
          AC12: the repo-evidence caller enforces (shadow "false"), does not compare with OCC (compare-with-occ "false"), and pins receipt-gate.yml@4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa with verifier-version 0.4.310 -- falsifier: uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_repo_evidence_caller_omn20073.py -q --noconftest -p no:cacheprovider -c /dev/null
  - id: "req-ci-off-change-control"
    statement: |-
      omnidash CI calls no reusable that nests the change-control preflight, admits no pull request to main by a change-control receipt line, and carries no workflow, pre-commit or required-checks value naming onex_change_control or occ-preflight.
    acceptance:
      - id: "AC13"
        statement: |-
          AC13: ban-hardcoded-runner-ip.yml pins omniclaude's ban-hardcoded-runner-ip.yml@a45ba68f053e9979c6edef21103c0e674e5f7630 with contents read only, and main-target-guard's own run block exits 1 for every pull request whose base is main (head dev with a receipt line included) and 0 for every other base -- falsifier: uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_occ_off_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null -k "runner_ip or main_target_guard"
      - id: "AC14"
        statement: |-
          AC14: no parsed value or key of a workflow, .pre-commit-config.yaml or .github/required-checks.yaml names onex_change_control, occ-preflight or a change-control receipt id, and the scan flags a planted value -- falsifier: uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_occ_off_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null -k "occ_value or names_occ"
evidence_requirements:
  - kind: "tests"
    description: "The contract-validation workflow reads no onex_change_control, pins omnibase_core exactly and keeps its names."
    command: "uv run --no-project --python 3.12 --with omnibase-core==0.47.39 --with pyyaml --with pytest python -m pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null -k \"test_workflow_ or test_required_check or test_omnibase_core_is_installed\""
  - kind: "tests"
    description: "The contract-validation step admits the repo contracts and refuses the planted contracts."
    command: "uv run --no-project --python 3.12 --with omnibase-core==0.47.39 --with pyyaml --with pytest python -m pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null"
  - kind: "tests"
    description: "The S6 cut-over removes OCC callers, preflight dependencies, recovery and required contexts and pins the scan without nested OCC preflight."
    command: "uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_no_occ_callers_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null"
  - kind: "tests"
    description: "The repo-evidence caller enforces repo-owned evidence without comparing with OCC at the S6 reusable and verifier pins."
    command: "uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_repo_evidence_caller_omn20073.py -q --noconftest -p no:cacheprovider -c /dev/null"
  - kind: "tests"
    description: "The runner-IP scan pins the reusable without the nested preflight and main-target-guard refuses every pull request to main."
    command: "uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_occ_off_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null -k \"runner_ip or main_target_guard\""
  - kind: "tests"
    description: "No workflow or hook config value names change control, and the scan flags a planted value."
    command: "uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/ci/test_occ_off_omn20074.py -q --noconftest -p no:cacheprovider -c /dev/null -k \"occ_value or names_occ\""
