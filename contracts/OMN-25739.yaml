schema_version: "1.0.0"
ticket_id: OMN-25739
title: Restore required contract checks on OmniDash PR 516
summary: >-
  Validate the dashboard ticket contract in PR 516 with the two existing CI
  validators and verify the resulting head through the SCM watcher.
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25739-contract-checks
    statement: Restore the required checks on PR 516 while preserving their validation rules.
    acceptance:
      - id: AC1
        statement: >-
          omnidash#516 reads a merge state other than DIRTY and every required context success at its new head, among them ONEX Schema Compatibility Check and contract-validation, read through the scm path after the push -- falsifier: `onex scm pr-view OmniNode-ai/omnidash#516` shows merge state DIRTY or a required context that is not success at the new head
      - id: AC2
        statement: >-
          no check is widened, skipped or bypassed, so the diff from 558f65e37e8f to the new head touches no workflow file, no required-contexts list and no baseline file to loosen a gate -- falsifier: `git diff 558f65e37e8f <new head> -- .github` or a checker config shows a removed assertion, a new skip or a loosened threshold
      - id: AC3
        statement: >-
          the new head is on the PR as a comment starting `Lab: head=<full sha>` with a red-then-green lab run behind it, or a STATUS row names cause=<one line> shared=yes with its evidence when the cause is outside the PR -- falsifier: `onex scm pr-view OmniNode-ai/omnidash#516` shows no comment with `Lab: head=` for the new head and the ledger holds no STATUS row with shared=yes for this ticket

dod_evidence:
  - id: dod-omn25739-required-contexts
    description: >-
      After publication, read the new head and merge state with `onex scm pr-view`
      and compare its required contexts with `onex scm pr-checks`. Record the
      full head and the result of each context. The hosted results are pending.
    source: manual
    binds_ac: [AC1]
  - id: dod-omn25739-gate-diff
    description: >-
      Compare the candidate with the original ticket head across workflows,
      required contexts, pre-commit configuration and ratchet baselines.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: git diff --exit-code 558f65e37e8f HEAD -- .github .onex_ratchets .pre-commit-config.yaml
  - id: dod-omn25739-lab-evidence
    description: >-
      Verify the SCM comment starts with the full new head and cites the host and
      the failing and passing workflow reproductions. For a shared cause, verify
      the ledger STATUS carries the cause and evidence. Check the applicable
      record before closing the ticket.
    source: manual
    binds_ac: [AC3]
