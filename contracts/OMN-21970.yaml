schema_version: "1.0.0"
ticket_id: "OMN-21970"
title: "Overview charts over the whole range, not-recorded token days, tier colours, card colours, motion and Settings"
summary: >-
  The local OmniDash stops reading only the newest 500 delegation runs: the per-run views walk the
  decisions exposure by its cursor, the daily charts draw served per-day totals when they are served,
  a day whose runs carry no token counts reads not recorded, every model is coloured by its tier with
  the product owner's palette, every summary card has its own concept colour and icon, the six sidebar
  pages are animated with reduced-motion fallbacks, and Settings spans the page with one card per
  provider. AC1 and AC7 are proven in omnimarket, not in this repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omnidash-acceptance"
    statement: "The omnidash acceptance criteria of OMN-21970, copied from the live ticket on 2026-11-04. AC1 (served per-day totals) and AC7 (cause of the missing token counts) belong to omnimarket and are not listed here. The ticket remains the source."
    acceptance:
      - id: "AC2"
        statement: "AC2: with All, 30 or 15 days selected, Overview's Runs per day and Tokens per day draw every day of the range from the served per-day totals, and the drawn runs sum to the headline total"
      - id: "AC3"
        statement: "AC3: no Overview, Runs or Usage view reads only the latest 500 runs; each covers the full selected range and the latest-500 notice line is gone"
      - id: "AC4"
        statement: "AC4: a day whose runs carry no token counts is marked not recorded on Tokens per day, never drawn as a zero bar"
      - id: "AC5"
        statement: "AC5: every chart or table that shows a model colours it by its tier with the palette above in light and dark, uses one colour per tier across all charts, and has a legend beside it"
      - id: "AC6"
        statement: "AC6: every served tier, including cheap_frontier and cheap_cloud which the palette does not name, resolves to a stated palette colour in light and dark, never a hash-derived colour, and the product owner confirms the mapping"
      - id: "AC8"
        statement: "AC8: every summary card on Overview, Usage, Runs and Delegation Evidence has its own concept colour and its own Lucide icon; the twelve card concepts have twelve different colours, every pair on one page at least 0.10 apart in OKLab and every pair anywhere at least 0.07, in light and dark; no two cards on a page share an icon; a concept keeps one colour on its card and its charts; normal text keeps at least 4.5:1 against its actual background, large figures and graphical accents at least 3:1; an unmeasured figure keeps the unavailable ink; model and tier series keep the AC5 tier colours"
      - id: "AC9"
        statement: "AC9: the six sidebar pages (Overview, Runs, Workflow, Usage, Settings, Delegation Evidence) are restyled and animated with four motion families: card figures count up, cards and panels rise in, chart bars and lines grow in, cards lift and glow on hover; under prefers-reduced-motion none of them runs and final values show at once; no animation changes a displayed value: a count-up ends on the exact served figure, a refresh does not replay it from zero, and a missing figure never animates"
      - id: "AC10"
        statement: "AC10: the Settings sections span the full width of the page (no 960px column, no table running past its section) and the page shows each user-facing field the backend serves for it and never a value it does not serve: one card per provider from /models with a short status (passed, failed with its failure class, not set up, not tested), its last test time, tested model, backend and endpoint, whether routing tries it first and its first model when served; the full failure text shows only when opened; a model list longer than three shows three and a count that expands; a provider not set up shows its set-up command; System status adds the store location and when the state last changed; a Pricing and routing section names the baseline model and pricing version served by metering-summary.v1; a section menu links the four sections; a provider the page does not know renders like the others; a null field is left out; each key keeps its Last used as OMN-19996 defines it (Never when unset), also when /models fails; the page stays read-only"
dod_evidence:
  - id: "dod-omn21970-ac2-ac4-daily-charts"
    description: "AC2 and AC4 at the chart and series level: with All selected, 20 served days carrying 600 runs are all drawn and sum to 600, a served history longer than 30 days is drawn whole, a day with no runs is zero runs and zero tokens, and a day whose runs carry no token counts stays not recorded. Overview's page binding of the served per-day exposure (daily.v1) is held back until the lab serves it; until then the charts draw from the walked run records."
    source: "manual"
    binds_ac: ["AC2", "AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/pages/local/insight-charts.omn21970.test.tsx src/pages/local/insights.omn21970.test.ts"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn21970-ac3-every-run-read"
    description: "AC3: the local decisions read and Delegation Evidence's read walk every served page by cursor (600, 1,200 and a four-page 1,955-run store read whole), a stuck cursor or failed page keeps the runs read and marks the read incomplete, and after a complete read no Runs, Usage, Overview or Evidence caption calls the runs the latest returned ones."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/layout/local-page-loader.omn21970-walk.test.ts src/services/event-dash-api.omn21970-walk.test.ts src/pages/RunsKpis.omn21970.test.tsx src/pages/local/usage-analysis.omn21970-captions.test.tsx src/pages/DelegationEvidencePage.omn21970-caption.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn21970-ac5-ac6-tier-colours"
    description: "AC5 and AC6: every tier in the served tier set resolves to the product owner's palette hex in light and dark, cheap_frontier and cheap_cloud to their stated family shades (light cheap_frontier the darker frontier shade #006541 the product owner chose 2026-11-04), each passing the palette's colour-blind floors in both themes, an unknown tier to none, never a hash colour; Model usage and Tier mix give a model and its tier the same colour. The product owner's confirmation of the light cheap_frontier shade is recorded on the ticket, not by this check."
    source: "manual"
    binds_ac: ["AC5", "AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run tests/lib/tier-colors.omn21970.test.ts"
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/lib/tier-colors.omn21970.test.ts"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn21970-ac8-card-colours"
    description: "AC8: in both themes the twelve card concepts are twelve colours at least 0.07 apart in OKLab, every pair on one page at least 0.10, each at least 4.5:1 on the card plain and under its tint, Runs wires p95 duration and escalated to their own concepts, and no two cards on a page share an icon."
    source: "manual"
    binds_ac: ["AC8"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/styles/card-palette.omn21970.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn21970-ac9-motion"
    description: "AC9: the rise-in and grow-in families run only under no-preference and switch off under reduced motion, every named keyframe is defined, and the count-up ends on the exact figure, shows a refreshed or mid-count figure at once, and shows the final figure at once under reduced motion or without matchMedia."
    source: "manual"
    binds_ac: ["AC9"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/styles/motion.omn21970.test.tsx src/components/dashboard/CountUpText.omn21970.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn21970-ac10-settings"
    description: "AC10: one card per provider with only served fields, the full error inside a closed disclosure, 18 models shown as 3 and +15 more, null fields left out, Tried first only when served, the Pricing and routing section, System status store location and state time, and the section menu."
    source: "manual"
    binds_ac: ["AC10"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run tests/pages/local/settings-providers.omn21970.test.tsx tests/pages/local/settings-sections.omn21970.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn21970-ac2-runs-per-day-axis"
    description: "AC2 (Jonah 2026-11-07): with All selected and the per-day totals not served, Runs per day spans every day metering-summary.v1 serves, the same axis as the Daily trend; a day whose verdicts the incomplete decisions read never reached draws no bar and reads Verdicts not read."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run tests/pages/LocalDashboardPage.omn21970.runs-axis.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
