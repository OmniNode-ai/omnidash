schema_version: "1.0.0"
ticket_id: "OMN-23330"
title: "Local dashboard: one number everywhere, readable charts, unified styles and a lighter bundle"
summary: >-
  Acceptance for OMN-23330, copied from the approved spec (records/plans/OMN-23330/spec.md, AC1 to AC37). Every
  criterion with a test is bound below to the test that proves it; AC15 and AC16 read the live Dependabot alerts and
  hold once the upgrades merge; AC17 and AC32 are comparisons recorded on the pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn23330"
    statement: >-
      The six local dashboard pages and Delegation Evidence read one number everywhere, draw readable charts, share
      one design-system kit, and ship a lighter bundle, with no change a reader sees beyond the approved fixes.
    acceptance:
      - id: "AC1"
        statement: >-
          Overview, Usage and Delegation Evidence show the same all-time savings figure from one definition. Proved
          by: npx vitest run tests/pages/local/one-number.allpages.test.tsx, its savings case, on the lab host
      - id: "AC2"
        statement: >-
          Overview and Delegation Evidence show the same all-time tokens figure from one definition, and Usage's
          tokens in plus tokens out add up to it. Proved by: npx vitest run
          tests/pages/local/one-number.allpages.test.tsx, its tokens case, on the lab host
      - id: "AC3"
        statement: >-
          Settings shows the "Model providers could not be read" notice only when no provider row is served, never
          above a served provider table. Proved by: npx vitest run
          tests/pages/local/settings-providers-notice.allpages.test.tsx on the lab host
      - id: "AC4"
        statement: >-
          every chart in src/theme/design-system/charts whose content is wider than its box shows a visible
          horizontal scrollbar, and Overview Model usage reaches all of its models. Proved by: npx vitest run
          tests/design-system/chart-scroll.allpages.test.tsx on the lab host, plus a live Chrome readback of
          scrollWidth against clientWidth on every chart
      - id: "AC5"
        statement: >-
          the first and last day labels of every daily chart draw inside the chart box, never clipped. Proved by:
          npx vitest run tests/design-system/axis-end-labels.allpages.test.tsx on the lab host
      - id: "AC6"
        statement: >-
          Overview Model usage and Tier mix print each bar's run count and share, and Usage tokens per day by model
          prints each day's total. Proved by: npx vitest run tests/pages/local/chart-values.allpages.test.tsx on the
          lab host
      - id: "AC7"
        statement: >-
          the Daily trend labels each line's peak value while keeping each line scaled to its own busiest day and
          its monotone curves. Proved by: npx vitest run tests/pages/local/daily-trend-peaks.allpages.test.tsx on
          the lab host -- note: Superseded in part by the operator on 2026-11-10 ("when hover then show where cursor
          point and proper details ... why over graph needed?"): the peak labels over the lines are removed; the
          plot shows a guide line and a dot per line at the pointed day and the readout gives the values. Bound to
          the test of that design.
      - id: "AC8"
        statement: >-
          the Activity breakdown and Daily trend readouts show the latest served day until the pointer selects
          another, so no blank row sits above the chart. Proved by: npx vitest run
          tests/pages/local/readout-default.allpages.test.tsx on the lab host
      - id: "AC9"
        statement: >-
          the Runs page shows every KPI label on one line at 1440 px, durations without fractional milliseconds, a
          duration caption in the axis's unit, and "<0.1%" for a nonzero share under 0.05%. Proved by: npx vitest
          run tests/pages/local/runs-polish.allpages.test.tsx on the lab host
      - id: "AC10"
        statement: >-
          Usage shows dates in the same short format as the other pages and lists model and tier legends on separate
          rows. Proved by: npx vitest run tests/pages/local/usage-polish.allpages.test.tsx on the lab host
      - id: "AC11"
        statement: >-
          Delegation Evidence leaves no empty column below Selected run at 1440 px and shows model names unbroken.
          Proved by: a live Chrome readback of the two column heights and the model name boxes at 1440 px, light and
          dark
      - id: "AC12"
        statement: >-
          Settings draws both provider tables in one table style, and its sticky section tabs never cover content
          when scrolled. Proved by: npx vitest run tests/pages/local/settings-polish.allpages.test.tsx on the lab
          host, plus a live Chrome readback while scrolled
      - id: "AC13"
        statement: >-
          the Workflow timeline says "not recorded" once per step. Proved by: npx vitest run
          tests/pages/local/workflow-timeline.allpages.test.tsx on the lab host
      - id: "AC14"
        statement: >-
          at the narrowest window no headline card sits alone on its row, chart day tracks are lighter than the
          bars, and the Cheap frontier colour meets 3:1 contrast against the light theme's track. Proved by: npx
          vitest run tests/design-system/contrast-and-grid.allpages.test.tsx on the lab host, plus a live Chrome
          readback at the narrowest window in both themes
      - id: "AC15"
        statement: >-
          omnidash dev has no open critical Dependabot alert. Proved by: npm audit --package-lock-only
          --audit-level=critical exits 0 (operator 2026-11-10: CI cannot read Dependabot alerts; on dev it exits 1
          with 5 critical), and after merge the Dependabot read counted by severity reads 0 critical -- note: Bound
          to npm audit over the lockfile by the operator on 2026-11-10, because the CI token cannot read Dependabot
          alerts (HTTP 403); npm audit draws on the same GitHub advisory data: on dev it exits 1 (5 critical, as
          Dependabot), on this branch 0. The Dependabot read itself is checked after merge.
      - id: "AC16"
        statement: >-
          omnidash dev has no open high Dependabot alert on a runtime dependency. Proved by: npm audit
          --package-lock-only --omit=dev --audit-level=high exits 0 (on dev it exits 1), and after merge the
          Dependabot read filtered to runtime scope reads 0 high -- note: Bound to npm audit over the lockfile
          without dev dependencies by the operator on 2026-11-10, for the same reason: on dev it exits 1 (1 critical
          and 14 high at runtime), on this branch 0. The Dependabot read itself is checked after merge.
      - id: "AC17"
        statement: >-
          after the dependency upgrades the full vitest, tsc, eslint and Playwright suites show no failure that dev
          does not have. Proved by: npx vitest run, npx tsc --noEmit, npm run lint and npx playwright test on the
          lab host at the base and at the head, compared failure by failure; the contract binds the full suites
          (Playwright with two workers and one retry), which fail on dev (operator 2026-11-10) -- note: Bound by the
          operator on 2026-11-10/11: tsc and eslint, and the 13 Playwright cases that fail on dev 9cd9c7cf, selected
          by title (one was renamed on this branch), each its own check; failing case lines go to stderr. Two of
          them (local-dashboard-contracts.spec.ts:150 and :459) overflowed by 3 px on the CI runner until a one-line
          headline label could no longer widen its card. The full comparison (dev 499 passed and 13 failed; head 0
          failed) is recorded on the pull request.
      - id: "AC18"
        statement: >-
          CostTrend3DBars.tsx and CostTrend3DArea.tsx are deleted together with their own tests and stories, and
          src/storybook-coverage-compliance.test.ts no longer lists their stories; QualityScoreTilted3D.tsx, its
          test, stories and src/storybook/fixtures/quality.ts stay because the registered quality-score-panel widget
          (quality/QualityScore, default 3d) lazy-loads it; StackedChart.tsx stays because live charts import it;
          and the build passes. Proved by: npx vitest run tests/design-system/no-dead-charts.allpages.test.tsx on
          the lab host, which fails while either deleted file exists, while any source file imports one by a static
          or a dynamic import, while the Storybook coverage list names one, or while StackedChart.tsx or
          QualityScoreTilted3D.tsx is missing (positive controls: the static StackedChart importers and
          QualityScore's dynamic QualityScoreTilted3D import are found)
      - id: "AC19"
        statement: >-
          money, count, percent, date and duration are formatted by one module, src/theme/format. Proved by: npx
          vitest run tests/lib/format.allpages.test.tsx on the lab host -- note: the module is src/theme/format, not
          src/lib/format, because the canonical-file-shape ratchet (OMN-21332) admits no new code file under src/lib
          (operator, 2026-11-10).
      - id: "AC20"
        statement: >-
          no toFixed or toLocaleString call sits outside src/theme/format, and an ESLint rule refuses a new one.
          Proved by: npx vitest run tests/lint/no-adhoc-format.allpages.test.tsx on the lab host, which runs the
          rule over src and catches a planted call as its control -- note: the module is src/theme/format, not
          src/lib/format, because the canonical-file-shape ratchet (OMN-21332) admits no new code file under src/lib
          (operator, 2026-11-10).
      - id: "AC21"
        statement: >-
          every page and widget refreshes from one declared setting, and none polls faster than 30 s unless its
          manifest declares why. Proved by: npx vitest run tests/lint/refresh-policy.allpages.test.tsx on the lab
          host
      - id: "AC22"
        statement: >-
          the main entry bundle is at most 250 KB gzipped, and echarts and three.js load only with the pages that
          use them. Proved by: npx vitest run tests/build/bundle-budget.allpages.test.ts over a fresh vite build on
          the lab host
      - id: "AC23"
        statement: >-
          each page loads only its own stylesheet chunk, and no CSS file is over 150 KB. Proved by: npx vitest run
          tests/build/bundle-budget.allpages.test.ts, its stylesheet case, on the lab host
      - id: "AC24"
        statement: >-
          LocalDashboardPage.tsx is split into one module per page plus shared parts, none over 1,000 lines, with no
          visible change. Proved by: npx vitest run tests/pages/local/module-size.allpages.test.ts plus the full
          vitest and Playwright suites unchanged against dev on the lab host
      - id: "AC25"
        statement: >-
          the count of static inline style attributes in src does not rise, and drops in every file this ticket
          touches. Proved by: npx vitest run tests/lint/inline-style-count.allpages.test.ts on the lab host against
          a recorded baseline
      - id: "AC26"
        statement: >-
          a headline card on Overview and Delegation Evidence lights up in its own colour when hovered (its border
          turns its accent colour and a soft glow in that colour appears) and never moves or changes size. It lights
          within 120 ms and starts to fade only after a hold of at least 80 ms, so moving the pointer from one card
          across the 12 px gap to the next hands the light over with no moment where neither card is lit; under
          reduced motion it changes at once. Proved by: npx vitest run
          tests/pages/local/card-hover-still.allpages.test.ts on the lab host, which fails while a rule for a
          hovered headline card sets transform, translate, margin, padding, width or height, while the hovered rule
          sets no accent border and glow, while the resting rule's border and glow transition has a delay under 80
          ms, or while the hovered rule's transition lasts over 120 ms, with planted rules as its controls; plus a
          live Chrome readback, light and dark, of each card's box at rest and hovered (equal) and of the card just
          left still lit while the pointer is in the gap
      - id: "AC27"
        statement: >-
          in each headline card's caption on Overview and Delegation Evidence, every figure and named thing wears
          the colour of the concept it names from the existing data-field-tone palette (spend, savings, runs and
          calls, tokens in, tokens out, quality pass, the baseline model), so one concept has one colour on every
          page and two concepts never share one; connecting words stay neutral. Proved by: npx vitest run
          tests/pages/local/caption-colours.allpages.test.tsx on the lab host, which fails while a caption figure or
          name has no tone or a tone that differs from its concept's tone elsewhere, plus a live Chrome readback of
          the computed colours on both pages, light and dark
      - id: "AC28"
        statement: >-
          each Overview headline card draws its caption directly under its figure, with the same figure-to-caption
          gap as a Delegation Evidence headline card, instead of pushing the caption to the bottom of a taller card.
          Proved by: npx vitest run tests/pages/local/headline-card-layout.allpages.test.ts on the lab host, which
          fails while any stylesheet rule gives a headline card caption margin-top: auto, plus a live Chrome
          readback of the figure-to-caption gap on Overview and Delegation Evidence (measured 2026-11-09: Overview
          17 to 22 px, Evidence 5 px; equal within 1 px after), light and dark, at 1440 px and the narrowest window
      - id: "AC29"
        statement: >-
          every component of the design-system kit (src/theme/design-system/components and
          src/theme/design-system/charts: card, figure, caption, panel, table, tabs, chips, day axis and the charts)
          is styled in one place, the design-system stylesheets under src/theme/design-system, and no stylesheet
          elsewhere under src sets a property on a kit component's class. Measured 2026-11-09: 24 stylesheets, 9,353
          lines, 324 rules naming .local-dashboard-panel across 5 files. Proved by: npx vitest run
          tests/lint/component-style-owner.allpages.test.ts on the lab host, which parses every stylesheet with
          postcss, fails on a rule outside src/theme/design-system whose subject is a kit component class, and
          catches a planted page rule as its control
      - id: "AC30"
        statement: >-
          no stylesheet under src/theme/design-system uses !important, and the count of !important across src never
          rises and falls below the 811 measured on 2026-11-09. Proved by: npx vitest run
          tests/lint/important-count.allpages.test.ts on the lab host against the recorded baseline of 811, with a
          planted !important as its control
      - id: "AC31"
        statement: >-
          one day-axis component in src/theme/design-system/charts draws the day labels of every daily chart
          (Overview Runs per day, Tokens per day and Daily trend, the Usage day charts and the Runs page day
          charts), so the AC5 end-label rule lives in one place; measured 2026-11-09: 5 separate day-axis
          implementations and 10 .gdb-day-label rules. Proved by: npx vitest run
          tests/design-system/one-day-axis.allpages.test.tsx on the lab host, which fails on day-label markup or a
          day-label class rule outside the kit, plus the AC5 test
      - id: "AC32"
        statement: >-
          the consolidation in AC29 to AC31 changes nothing a reader sees beyond the fixes this ticket approves (AC3
          to AC14 and AC26 to AC28). Proved by: npx playwright test on the lab host at the base and at the head
          compared failure by failure, plus full-page screenshots of all seven pages in light and dark at 1440 px
          and 390 px at the commit before the consolidation and after it, whose pixel difference is zero outside the
          regions those fixes change; the contract binds the specs that pin the consolidation's visible results
          (Event-page label, badge and grid spec; kit ownership; no !important; one day axis), which fail on dev
          (operator 2026-11-10) -- note: Bound by the operator on 2026-11-10 to the specs that pin the
          consolidation's visible results and fail on dev: the Event-page label, badge and grid spec, kit ownership
          (AC29), no !important (AC30) and one day axis (AC31). The 48-image base-against-head screenshot compare
          (tests/e2e/visual-capture.omn23330.spec.ts, tests/visual/compare.mjs) is recorded on the pull request.
      - id: "AC33"
        statement: >-
          each Overview headline card's change against the previous window is coloured by what the change means: for
          Savings and Delegation Quality a rise wears the field pass colour and a fall the warn colour; for Actual
          spend a rise wears the warn colour and a fall the field pass colour; Agent calls and Tokens processed are
          volume, so their change stays neutral; "No change" and "No earlier data" stay neutral; the arrow and its
          text share the colour and meet 4.5:1 contrast in both themes; a previous value of 0 or none never shows a
          percent. Proved by: npx vitest run tests/pages/local/card-change-tone.allpages.test.tsx on the lab host
          (each card for a rise, a fall, no change and no earlier data, failing on the current neutral chips), plus
          a live Chrome readback in both themes.
      - id: "AC34"
        statement: >-
          hovering or focusing a headline card's figure shows its exact value (every digit, e.g. 1,144,630 tokens,
          $5.6412) and, when a previous window exists, the previous window's value and the absolute change; in All
          time, which has no previous window, it shows the exact value only. Proved by: npx vitest run
          tests/pages/local/card-figure-detail.allpages.test.tsx on the lab host, plus a Playwright hover and
          keyboard-focus readback at 1440 px.
      - id: "AC35"
        statement: >-
          on every daily chart (Overview Daily trend, Runs per day and Tokens per day; the Usage day charts; the
          Runs page day charts) today's UTC day, while it is in progress, is drawn distinctly (a dashed segment into
          today on a line, a lighter bar on a bar chart) and its readout says "Today so far"; finished days are
          drawn as now. Proved by: npx vitest run tests/design-system/today-in-progress.allpages.test.tsx on the lab
          host with a fixed clock (today in progress and a finished day), plus a Playwright readback.
      - id: "AC36"
        statement: >-
          on every page with the time-window control, single keys choose the window: A all time, T today, W last 7
          days, F last 15 days, M last 30 days, Q last 90 days; "?" opens a list of these keys and Escape closes it;
          no key acts while typing in an input, textarea, select or editable field, or with Ctrl, Cmd or Alt held.
          Proved by: npx playwright test tests/e2e/keyboard-windows.omn23330.spec.ts on the lab host (each key
          changes ?window= and the figures; typing the same letters in the run filter changes nothing).
      - id: "AC37"
        statement: >-
          every kit chart in src/theme/design-system/charts has a "Show as table" toggle, reachable by keyboard,
          that swaps the plot for a table of the same rows and values the chart draws (the day or bar label, then
          each series) and back; the choice holds per chart for the session. Proved by: npx vitest run
          tests/design-system/chart-table-twin.allpages.test.tsx on the lab host (each kit chart rendered from one
          fixture, its table cells compared with the values it draws), plus a Playwright toggle readback.
      - id: "AC38"
        statement: >-
          Delegation Evidence's page title scrolls away with its content, as on Runs and Usage. Measured 2026-11-11:
          after scrolling the content 800 px the Evidence h1 stays at 82 px, while the Runs and Usage h1 move from
          78 px to -722 px. Proved by: npx playwright test tests/e2e/one-design-system-title-scroll.spec.ts
          --project=chromium on the lab host, which scrolls each of the six pages 800 px and fails while any page's h1
          has not moved.
      - id: "AC41"
        statement: >-
          every money figure in a kit chart's table is written by formatDashboardUsd, the display rule every other
          money figure on the local pages follows (two decimals at $1 and above, up to four below $1, cut and never
          rounded up), so one amount reads the same in a chart's table and beside it. Measured 2026-11-11 on Usage: the
          Savings per day chart's table reads $0.66, $0.44 and $0.62 for Nov 8, 6 and 5 where the savings table under
          it reads $0.6558, $0.4395 and $0.6223. Proved by: npx vitest run
          tests/design-system/chart-table-money.allpages.test.tsx on the lab host, which fails while a chart table
          writes 0.655882 as anything but $0.6558, and keeps $1.48 for 1.4812.
      - id: "AC42"
        statement: >-
          the scheduled evidence closer counts this ticket's new checks as behaviour proof. The AC38 and AC41 checks
          are written as "npm run test:e2e -- <spec>" and "npm test -- run <file>", which omnimarket dev 141b5fb8's
          classify_command reads as BEHAVIOR, and package.json's pretest and pretest:e2e install dependencies on a
          runner checkout without node_modules; the 42 merged checks stay byte-identical. Proved by: classify_command
          over the contract on the lab host, the AC38 and AC41 checks BEHAVIOR (control: their npx form reads
          INDETERMINATE), plus the repo-evidence CI run of both on a runner checkout without node_modules.
