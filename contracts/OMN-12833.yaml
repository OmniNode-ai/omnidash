schema_version: "1.0.0"
ticket_id: "OMN-12833"
title: "A2.5: Dashboard one-backend component correctness sweep — single standard projection backend"
summary: >-
  Close-the-loop plan track A2.5 (2026-06-08 close-the-loop plan, OmniNode planning workspace). Makes EVERY demo-visible
  dashboard component render through ONE standard projection backend (the stability-test Postgres-backed
  projection API, reached same-origin via the Vite /projection proxy). Inventoried all
  32 components in src/registry/component-registry.json, probed each component's topic(s) against the single
  backend, and classified each as visible/projection-backed, visible/degraded-labeled, or hidden/disabled.
  Adds manifest fields paletteVisibility + authorityLabel (shared/types/component-manifest.ts), a single
  classification source of truth (shared/types/palette-visibility.ts) stamped into the generated registry by
  scripts/generate-registry.ts, and ComponentRegistry.resolveImplementations() forcing hidden components to
  not_implemented (kept out of the palette) regardless of whether their code exists. Adds a single projection
  base-url resolver (src/data-source/projection-base-url.ts) so all reads target ONE backend; the correlation
  trace read and HttpSnapshotSource now resolve through it. Result: 8 visible/projection-backed (delegation
  chain + control plane incl. SEA artifact), 2 visible/degraded (context experiment keep-set + evidence
  pipeline), 22 hidden/disabled. event-stream is hidden because registration.v1 (200/100r) does not match its
  required StreamEvent shape and crashes render — hidden, not back-fed. Playwright network proof: every
  /projection/{topic} hits the single backend origin; ZERO requests to :8765, :3010, :3002, fixtures, or
  bespoke routes; zero failed widgets on the populated dashboard.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
evidence_requirements:
  - kind: "tests"
    description: >-
      src/integration.part3.test.tsx asserts only one-backend-visible components resolve to available and no
      hidden component resolves. src/registry/ComponentRegistry.test.ts asserts a hidden component with a
      resolvable implementation key is forced to not_implemented. src/data-source/projection-base-url.test.ts
      asserts single-backend URL resolution (proxy-relative + absolute). Full suite (no -k): npx vitest run.
    command: "cd omnidash && npx vitest run"
  - kind: "manual"
