    description: >-
      omnidash PR classifies all 32 components through the single standard projection backend (8
      projection-backed / 2 degraded / 22 hidden), adds paletteVisibility + authorityLabel + the one-backend
      base resolver, and surfaces authority labels in the palette. Full vitest suite passing; tsc --noEmit
      clean; eslint --max-warnings=0 clean; pre-commit all-files green (OMNIBASE_CORE_PATH set per
      feedback_omnidash_worktree_precommit_corepath). Playwright network + render evidence packet attached.
    source: "manual"
    status: "verified"
    checks:
