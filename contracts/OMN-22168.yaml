        check_value: >-
          test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/styles/tab-hues.omn22168.test.ts
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn22168-ac1-pass-band-tokens"
    description: >-
      AC1, the 2026-11-05 Runs review only, not the whole criterion: the five pass-rate band colours and their inks
      (--ds-pass-band-1..5 and their -ink) are defined once in src/theme/design-system/tokens.css for light and dark,
      five different colours with each ink at 4.5:1 on its pill, and a rate falls in its band at every boundary.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
