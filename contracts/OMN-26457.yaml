title: "OmniDash 1.1.15 ships the OMN-26439 fix"
summary: >-
  Acceptance for OMN-26457, copied from the live ticket on 2026-11-22. omnidash dev moves to 1.1.15 so the v1.1.15 tag
  carries 5870118c (OMN-26439). AC1 is bound to tests/ci/test_release_version_omn21469.py. AC2 (the tag and its
  release) and AC3 (the omnimarket pin) are proved after merge by readbacks and the omnimarket pin test, so this contract lists only AC1 (Lakshman, YES BATCH-1073 BUMP-CONTRACT-26457-B).
