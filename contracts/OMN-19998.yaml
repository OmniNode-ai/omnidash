title: 'omnidash: public-repository CI runs on GitHub-hosted runners'
summary: Operator RULING 2026-10-16T07:07:09Z, "Ci runners should be for private repos only." omnidash is public, so every workflow job runs on a literal GitHub-hosted label and omnibase_core's check-public-runner-placement runs as a CI Summary job and as a pre-commit hook.
