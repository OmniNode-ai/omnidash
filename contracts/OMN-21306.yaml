  - id: "dod-omn21306-ac4-browser-interactions"
    description: >-
      AC4: Usage zoom/reset retains its selected served day and table; paging never
      substitutes a different run identity and refresh retains a still-listed id;
      missing ids are not selector options; an Evidence tap matches aria-expanded;
      Workflow step icons and repeated attempts match the served order.
      Private baseline mutation controls independently remove each behavior.
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-verification-interactions.spec.ts --project=chromium --workers=1 --retries=0 --grep \"Usage zoom and reset\""
        cwd: "${OMNI_HOME}/omnidash"
