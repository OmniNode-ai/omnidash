schema_version: "1.0.0"
ticket_id: "OMN-21306"
title: "OmniDash text readability and redesign verification"
summary: >-
  Raise shared typography and destination styles to a 12 px floor, retaining layout
  and served values. Scan all eleven destinations in both themes and Developer states
  at desktop and phone sizes. Add browser interaction checks with behavior-removal
  controls. Fixtures certify rendering only. AC2 and AC3 require post-merge evidence;
  AC5 reconciles the separately owned design specification.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: "Acceptance criteria copied from the live ticket on 2026-10-22; the ticket remains the source."
    acceptance:
      - id: "AC1"
        statement: "AC1: No visible text on the eleven destinations renders below 12 px at 1440x900 and 390x844 (measured 2026-10-22: Runs 25 strings, Workflow 17, Delegation Evidence 29, Experimentation 9, Agent Workbench 27, Event Bus 34, Lab 52) -- falsifier: npx playwright test of a font-size scan over all eleven pages that fails on any computed font-size under 12 px, with a planted 10 px element as its control"
      - id: "AC2"
        statement: "AC2: A ten-pass verification matrix exists for the merged code, each pass naming the tested sha, the command or interaction, expected and observed result and its artifact -- falsifier: a matrix row with no sha equal to the tested dev commit, or a pass with no artifact path"
      - id: "AC3"
        statement: "AC3: A walk in the main Chrome of a served build at the merged sha covers the six core pages and Delegation Evidence, with Developer off and on, light and dark -- falsifier: the walk record's build sha differs from the dev commit, or a page or state is missing from it"
      - id: "AC4"
        statement: "AC4: Browser tests cover the interactions the evidence run found untested: Usage chart zoom and reset, chart selection kept across pagination and refresh, a missing run id on the chart selector, tap-to-expand with aria-expanded on Evidence rows, and per-step icons with attempts on Workflow -- falsifier: npx playwright test of each new case, each failing on dev 5afbe1b8 with the behaviour removed"
      - id: "AC5"
        statement: "AC5: The OMN-21166 spec's AC20 layout and AC25 canvas wording are reconciled with the later amendments and its stale line references corrected -- falsifier: a spec criterion that contradicts another, or cites a test line that does not hold its assertion"
evidence_requirements:
  - kind: "tests"
    description: "Computed-font census and interaction regression with planted small-text and behavior-removal controls."
    command: "npm run test:e2e -- tests/e2e/local-dashboard-readability-12px.spec.ts tests/e2e/local-dashboard-verification-interactions.spec.ts tests/e2e/local-dashboard-typography-hierarchy.spec.ts tests/e2e/local-dashboard-activity-window.spec.ts tests/e2e/local-dashboard-routing-disclosure.spec.ts --project=chromium --workers=1 --retries=0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21306-ac1-readable-text"
    description: >-
      AC1: HTML text, SVG text, generated mobile labels and input text are scanned
      with computed font sizes on every destination and both required viewports.
      Each page includes both themes and Developer states. A planted 10 px control
      must be detected, hidden text excluded and 12 px text accepted.
      Separate checks keep each browser startup within the evidence gate budget.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-readability-12px.spec.ts --project=chromium --workers=1 --retries=0 --grep \"font scanner detects\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-readability-12px.spec.ts --project=chromium --workers=1 --retries=0 --grep \"Overview at 1440x900\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-readability-12px.spec.ts --project=chromium --workers=1 --retries=0 --grep \"Runs at 1440x900\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-readability-12px.spec.ts --project=chromium --workers=1 --retries=0 --grep \"Workflow at 1440x900\""
