        check_value: "python -m pytest tests/ci/test_repo_evidence_caller_omn20073.py -q --noconftest -p no:cacheprovider -c /dev/null -k current_receipt_gate"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-repo-evidence-ac3"
    description: "The caller runs in shadow mode and compares with OCC."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "python -m pytest tests/ci/test_repo_evidence_caller_omn20073.py -q --noconftest -p no:cacheprovider -c /dev/null -k shadow_mode"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-repo-evidence-ac4"
    description: "The manifest requires no repo-evidence context."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "python -m pytest tests/ci/test_repo_evidence_caller_omn20073.py -q --noconftest -p no:cacheprovider -c /dev/null -k required_check"
        cwd: "${OMNI_HOME}/omnidash"
