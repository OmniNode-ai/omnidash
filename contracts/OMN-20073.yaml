    description: "The caller workflow has the required base-branch trigger and read-only permissions."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "python -m pytest tests/ci/test_repo_evidence_caller_omn20073.py -q --noconftest -p no:cacheprovider -c /dev/null -k base_branch"
        cwd: "${OMNI_HOME}/omnidash"
