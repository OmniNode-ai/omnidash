---
schema_version: "1.0.0"
ticket_id: "OMN-21015"
title: "The local dashboard shows the demo's in-scope figures on Overview, Runs and Usage, and meets four dashboard requirements not yet built"
summary: "The omnidash page half of AC1, AC7, AC8 and the token series of AC4, and of AC5 and AC9 for the six pages' redesign. Overview renders baseline against actual spend per UTC day from the day rows of metering-summary.v1 and its headline tiles switch between today (UTC) and all time, each reading the served row for that window; the Runs list filters by backend; Usage shows tokens in and out per day stacked by model, in the order the exposure serves them. Every figure is read from a served exposure; none is summed or priced in the browser. On this change also AC3: the Runs list shows each run's served modelled saving, with AC5's guard amended for exactly that one field. On this change also AC2: the Tier mix lists each model under its tier from the model-routing view. On this change also AC4's by-model table: each row's tier and share of calls."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this change serves, as declared on the OMN-21015 ticket body, read on 2026-10-14. The ticket body is the source and this block is the copy.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Overview renders baseline against actual spend per UTC day from the day rows of `metering-summary.v1`, the series [OMN-20007](<https://linear.app/omninode/issue/OMN-20007>) serves -- falsifier: a page test over a recorded two-day fixture fails when either series is absent, or when the panel's window total differs from the headline spend and savings
      - id: "AC3"
        statement: |-
          AC3: The Runs list shows savings per run against the named baseline (requirement RU-1), and a typed not-measured state for an unmeasured run -- falsifier: a measured fixture row with no savings cell, or an unmeasured row that shows 0
      - id: "AC4"
        statement: |-
          AC4: Usage shows tokens in and tokens out per day as a stacked series split by model (requirement US-1), and its by-model table shows each model's share of calls and its tier beside the calls column it already has -- falsifier: the window sums differ from `onex metering --json`, or the shares do not sum to 100
      - id: "AC5"
        statement: |-
          AC5: Every new figure reads one served exposure and none is computed in the browser from prices -- falsifier: the [OMN-19980](<https://linear.app/omninode/issue/OMN-19980>) guard fails on a price literal or price arithmetic outside the metering compute
      - id: "AC7"
        statement: |-
          AC7: Overview's headline tiles switch between today (UTC) and all time (requirement OV-3), each reading the served `metering-summary.v1` rows for that window -- falsifier: a page test over a fixture whose today and all-time rows differ fails when the tiles do not change with the switch, or when a today figure is summed in the browser
      - id: "AC8"
        statement: |-
          AC8: The Runs list filters by backend as well as by status, cause, model and window (requirement RU-1) -- falsifier: a page test over a fixture with two backends still shows a row of the other backend after one is selected
      - id: "AC2"
        statement: |-
          AC2: Overview's Tier mix lists each model under its tier with its share of runs and its cost -- falsifier: a fixture with two models in one tier renders one row, or model shares that do not sum to the tier's share
      - id: "AC9"
        statement: |-
          AC9: The Workflow page opens for a run chosen in the Runs list and for a pasted correlation id, and shows the newest run when no id is given (requirement WF-3) -- falsifier: a page test that chooses a fixture run, or pastes its id, and finds another run's steps or none. Needs `run-trace.v1` served ([OMN-19987](<https://linear.app/omninode/issue/OMN-19987>))
      - id: "AC10"
        statement: |-
          AC10: API Keys shows the dashboard's access mode, when the current token was minted and how to rotate it (requirement AK-2) -- falsifier: after a restart the minted time on the page has not moved. Needs `local-environment.v1` served ([OMN-19988](<https://linear.app/omninode/issue/OMN-19988>))
evidence_requirements:
  - kind: "tests"
    description: "AC1: over a recorded two-day metering-summary.v1 fixture the Overview panel shows both series per UTC day; a missing series, a window total that differs from the headline spend and savings, or an unplaced served column fails."
    command: "npx vitest run src/pages/LocalDashboardPage.omn21015.spend-by-day.test.tsx"
  - kind: "tests"
    description: "AC7: the headline tiles change with the today / all-time switch, each reading the served row for its window; the Savings percentage line follows the chosen window; nothing is summed in the browser."
    command: "npx vitest run src/pages/LocalDashboardPage.omn21015.overview-window.test.tsx src/pages/LocalDashboardPage.omn21015.window-pct.test.tsx"
  - kind: "tests"
    description: "AC8: over a fixture with two backends, choosing one leaves no row of the other."
    command: "npx vitest run src/pages/LocalDashboardPage.omn21015.runs-backend.test.tsx"
  - kind: "tests"
    description: "AC4, token series: tokens in and out per day stacked by model in the exposure's served order, each segment as wide as its share of the served count."
    command: "npx vitest run src/components/dashboard/usage/UsageTokensByDay.omn21015.test.tsx"
  - kind: "tests"
    description: "AC2: under each tier the Tier mix lists its models with share of runs and cost as served; two models in one tier are two rows and their shares sum to the tier's."
    command: "npx vitest run src/pages/LocalDashboardPage.omn21015.tier-models.test.tsx"
  - kind: "tests"
    description: "AC5, the redesign's charts: every chart plots only the served values, one point per served row, nothing computed in the browser. The OMN-19980 savings-source guard runs in the full suite beside it."
    command: "npx vitest run src/pages/local/charts.omn21015.test.tsx src/pages/LocalDashboardPage.omn21015.runs-charts.test.tsx"
  - kind: "tests"
    description: "AC9, opening a run: a run named on Overview or Runs opens that run's Workflow, and Workflow links to the run before and after it in the served list."
    command: "npx vitest run src/pages/LocalDashboardPage.omn21015.interactive.test.tsx src/pages/LocalDashboardPage.omn21015.run-neighbours.test.tsx"
  - kind: "tests"
    description: "AC3: the Runs list shows each run's served modelled saving against its named baseline, and a typed not-measured state, never 0, for an unmeasured run."
    command: "npx vitest run tests/pages/LocalDashboardPage.omn21015.run-saving.test.tsx src/pages/LocalDashboardPage.runs.test.tsx"
  - kind: "tests"
    description: "AC5: the OMN-19980 guard refuses a savings field from any exposure but the one allowed, a price literal and price arithmetic outside the metering compute."
    command: "npx vitest run tests/pages/local/omn19980.savings-source.test.ts"
  - kind: "tests"
    description: "AC4, by-model table: each row shows its tier and its served share of calls beside the calls column; a missing share says Not recorded."
    command: "npx vitest run tests/dashboard/usage/UsageByModelDayWidget.omn21015.test.tsx src/components/dashboard/usage/UsageByModelDayWidget.test.tsx"
  - kind: "tests"
    description: "AC10, card half only: the access card shows the dashboard's own served access mode, mint time and rotate hint, a newer mint time after a restart, Not recorded for a missing value, and what it waits on with no row."
    command: "npx vitest run tests/pages/local/access.omn21015.test.tsx"
