    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/pages/LocalDashboardPage.omn19991.alerts.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn19991-alerts-not-the-runs-table"
