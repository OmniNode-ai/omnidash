    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/pages/LocalDashboardPage.omn19991.alerts.test.tsx -t A2"
        cwd: "${OMNI_HOME}/omnidash"
