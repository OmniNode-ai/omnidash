        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn26665-ac6-mechanisms"
    description: >-
      AC6, hosted: the coverage helper reports the rows it judged and the oldest day (M1), a 7-day Overview with 500 rows
      from the last 24 hours reads Not measured for the full window and draws no daily chart while rows that reach back
      past the window start draw it (M2, M3), one pod's probe is 503 with no bundle and with the projection down, 200 when
      both answer and 503 while draining with the read in flight still finishing, and the page keeps its rows and says it is
      reconnecting while reads fail and clears when they succeed. Mutation controls run on this branch: coverage always true
      fails M2; dropping the bundle, the projection or the draining term from readiness fails the probe case; hiding the
      reconnecting notice fails the page case.
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "npm ci --prefer-offline --no-audit --no-fund && npx vitest run tests/pages/LocalDashboardPage.omn26665.ac6-mechanisms.test.tsx && npx vitest run server/__tests__/lifecycle.omn26665.test.ts -t \"AC6\" && npx vitest run tests/pages/LocalDashboardPage.omn26665.reconnecting.test.tsx -t \"AC6\""
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn26665-ac6-integrated-reading"
    description: >-
      AC6, read on a build that carries this change: it takes the 7-day decisions read once and prints the row count
      and the oldest and newest row time (it fails on an empty read or a row with no time), then watches the readiness
      probe for OMNIDASH_WATCH_SECONDS while a dev rollout runs and prints the longest stretch the probe was not ready
      (it fails if the probe answers anything but 200 or 503 with the pod still reachable, or never returns to 200).
      A connection that cannot be made during the rollout counts as not ready, which is what the page reads as
      reconnecting. OMNIDASH_URL is the dashboard's own address. Hosted CI cannot reach a dev host, so only the local
      Done gate runs this item. It binds no criterion and does not stand in for the hosted tests; the on-screen reconnecting
      text during that rollout is recorded in the pull request.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          python3 -c '
          import os, json, time, urllib.request as u, urllib.error as e
          base = os.environ["OMNIDASH_URL"].rstrip("/")
          topic = "onex.snapshot.projection.delegation.decisions.v1"
          body = json.load(u.urlopen(base + "/projection/" + topic + "?window=7d", timeout=30))
          rows = body if isinstance(body, list) else (body.get("rows") or body.get("data") or [])
          at = sorted(r.get("written_at") or r.get("created_at") for r in rows if isinstance(r, dict) and (r.get("written_at") or r.get("created_at")))
          assert rows and at, "the 7-day read returned no rows with a time"
          print("7d read: rows", len(rows), "oldest", at[0], "newest", at[-1])
          watch = float(os.environ.get("OMNIDASH_WATCH_SECONDS", "120"))
          end = time.time() + watch
          longest = 0.0
          since = None
          last = None
          while time.time() < end:
              try:
                  last = u.urlopen(base + "/api/health-probe", timeout=5).status
              except e.HTTPError as err:
                  last = err.code
              except Exception:
                  last = None
              assert last in (200, 503, None), "unexpected probe status %s" % last
              now = time.time()
              if last == 200:
                  since = None
              else:
                  since = since or now
                  longest = max(longest, now - since)
              time.sleep(0.5)
          assert last == 200, "the probe did not return to 200"
          print("rollout: longest not-ready stretch %.1f s over %.0f s" % (longest, watch))
          '
        cwd: "."
