schema_version: "1.0.0"
ticket_id: "OMN-26665"
title: "The Overview keeps its window, rollouts drain, reconnects keep rows, and 7-day figures need rows that reach 7 days"
summary: >-
  Acceptance for OMN-26665, from the approved spec. AC1 to AC5 are each bound to the vitest file that carries that
  criterion's falsifier; every one of those files is new on this branch, so each check fails at the merge base (no test
  file found) and passes at the head. AC6 is bound to hosted tests of its two mechanisms (amended
  2026-11-25), which run in CI before merge and fail at the merge base; the reading on a real merged build (one 7-day read
  measured once, one dev rollout timed) is kept as a separate local Done gate item that binds no criterion and does not
  stand in for the hosted tests, and its recorded read and timing go in the pull request after deploy.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26665-dashboard-window-rollout-reads"
    statement: >-
      The Overview keeps its time window across navigation, a rollout drains instead of cutting reads, a server that
      cannot be reached keeps the last rows on screen, the header tells an empty read from a failed one, and no 7-day
      figure is drawn from rows that do not reach the start of the window.
    acceptance:
      - id: "AC1"
        statement: >-
          the window persists in the URL and the UI after leaving the Overview and coming back, an explicit query
          parameter overrides the remembered window, and a fresh tab opens on all time -- falsifier: tests R1 to R6 in
          tests/pages/LocalDashboardPage.omn26665.window-return.test.tsx; R1 goes from /overview?window=7d to Runs and
          back and fails unless the address is /overview?window=7d again, R2 is the 30d control
      - id: "AC2"
        statement: >-
          SIGTERM stops new requests, lets the reads already running finish, then exits; readiness fails until the
          built bundle and the projection API both answer -- falsifier: tests S1 to S5 and R1 to R4 in
          server/__tests__/lifecycle.omn26665.test.ts; S1 sends SIGTERM during a slow read and fails unless that read
          ends with its 200 before exit, R1 serves no bundle and fails unless readiness answers 503 naming the bundle
      - id: "AC3"
        statement: >-
          an unreachable server keeps the last rows visible with a reconnecting indicator, and the indicator clears when
          reads succeed again -- falsifier: tests C1 to C5 in tests/pages/LocalDashboardPage.omn26665.reconnecting.test.tsx;
          C1 fails every read and fails unless the earlier row stays on screen and the reconnecting text shows
      - id: "AC4"
        statement: >-
          the header tells a served empty status read ("Runtime status not recorded") from a failed or
          timed-out one ("Runtime status unavailable"), and spend panels use a read deadline set per data
          source that shows loading, not failure, until it is reached -- falsifier: tests T1 to T4 in
          tests/pages/LocalDashboardPage.omn26665.status-read.test.tsx (T1 times out the status read at 5 s
          and fails unless the header says Runtime status unavailable; T2 is the served-empty control that
          still says Runtime status not recorded; T3 and T4 test the strip prop directly) and tests P1 to P5
          in tests/pages/LocalDashboardPage.omn26665.deadlines.test.tsx (P1 and P2 hold a 7 s spend read open
          and assert loading, not failure, until its own deadline; P3 times out a decisions read (Last run not
          read); P4 is the served-empty control (Last run not recorded); P5 a decisions read in flight (Last
          run loading))
      - id: "AC5"
        statement: >-
          no 7-day figure on the Overview or Runs is drawn from rows that do not reach the window start; one
          shared coverage helper decides, and a figure that fails it reads "Not measured for the full window"
          -- falsifier: tests V1 to V6 and H1 in src/pages/local/insight-charts.omn26665.coverage.test.tsx
          (V1 gives 500 rows from the last 24 hours under a 7-day window and fails unless the figure reads Not
          measured, V2 is the control with rows spanning past the window start) and tests A1 to A5 in
          src/pages/local/insight-charts.omn26665.analysis-coverage.test.tsx (A1 to A5 prove the summary More
          activity tiles, every Runs analysis tab and the view-all routing, quality, performance and hour
          sections read "Not measured for the full window" for 500 rows from the last 24 hours under a 7-day
          window, each with a spanning-rows control)
      - id: "AC6"
        statement: >-
          the two mechanisms behind the merged-build reading are proved by hosted tests before merge: (a) the 7-day read
          reports its row count and the oldest row day through the shared coverage helper, and a figure drawn from rows
          that do not reach the window start reads "Not measured for the full window"; (b) the readiness probe answers 503
          while the server drains and 200 once the bundle and projection answer, and the page keeps its last rows with the
          reconnecting text while reads fail -- falsifier: tests M1 to M3 in
          tests/pages/LocalDashboardPage.omn26665.ac6-mechanisms.test.tsx, the case named AC6 in
          server/__tests__/lifecycle.omn26665.test.ts, and the case named AC6 in
          tests/pages/LocalDashboardPage.omn26665.reconnecting.test.tsx; the hosted tests prove the mechanisms, not the live
          figures, which stay a note in the pull request
