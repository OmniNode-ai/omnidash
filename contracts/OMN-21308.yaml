# Browser checks require the owned OMN-21166 governed timeout-input dependency;
# keep checks bound and fail closed until the caller can legitimately provide its budget.
schema_version: "1.0.0"
ticket_id: "OMN-21308"
title: "Consistent dashboard icons and colours"
summary: >-
  Consolidate the existing destination, field, model, tier, outcome and run-step
  identities. Verify actual rendered icons and model colours, including unpriced-first
  input, and record the complete eleven-destination light/dark census.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-live-acceptance"
    statement: "All four acceptance criteria copied verbatim from the live ticket on 2026-10-23; the ticket and approved plan interpretations remain authoritative. No acceptance criterion is dropped for a time budget."
    acceptance:
      - id: "AC1"
        statement: "AC1: Each concept the pages show (destinations, fields, models, tiers, outcomes, run steps) maps to exactly one icon and one colour in one shared identity, and no two concepts share the same icon and colour -- falsifier: npx vitest over the identity that fails on a concept with two icons or two concepts with one icon and colour pair"
      - id: "AC2"
        statement: "AC2: Every page draws a concept with its identity icon: the Workflow model row uses the model icon, the Outcome row uses the pass or fail icon, and Without a tier uses the unrouted icon -- falsifier: npx playwright test reading the icon drawn for each named concept on each page, failing on dev 3ea4e59c where the Workflow model row draws Bot"
      - id: "AC3"
        statement: "AC3: A chart slice, bar or line has the same colour as its legend entry and as that model's colour elsewhere on the page, including when an unpriced model is listed before a priced one -- falsifier: npx playwright test with a fixture that lists an unpriced model first and compares each donut slice colour to its legend swatch and the Usage model widget swatch, failing on dev 3ea4e59c"
      - id: "AC4"
        statement: "AC4: A full walk of the eleven destinations at 1440x900 in light and dark records every icon and colour shown with the concept it stands for, and lists none shared by two concepts -- falsifier: the walk record, produced by an npx playwright test that collects each drawn icon and colour with its label, failing on any pair used for two concepts"
evidence_requirements:
  - kind: "tests"
    description: "AC1 supplemental Evidence field-colour consistency in light and dark: actual quality pass/fail statistics and bars, baseline cost, actual cost and savings bars, and the savings hero use their shared canonical concept colours. This focused check compares existing visible labels and rendered paint; it does not claim the full icon registry or eleven-destination census."
    command: "if ! test -d node_modules; then npm ci --no-audit --no-fund || exit $?; fi; node node_modules/playwright/cli.js test tests/e2e/evidence-concept-colours.omn21308.spec.ts --project=chromium --workers=1 --retries=0 --trace=on"
  - kind: "tests"
    description: "AC1 named-tier colour consistency in light and dark: local and cloud table icons, served-share chart slices, share legends and run-count bars use the same canonical tier colour. This supplements the complete registry audit and retains the real three-palette base failure; chart geometry is not treated as a Lucide icon."
    command: "if ! test -d node_modules; then npm ci --no-audit --no-fund || exit $?; fi; node node_modules/playwright/cli.js test tests/e2e/tier-identity.omn21308.spec.ts --project=chromium --workers=1 --retries=0 --trace=on"
  - kind: "tests"
    description: "Shared identity registry and actual declared colour/icon-pair audit, alias preservation and planted duplicate-pair control. The new test must be located under tests/identity so the unchanged receipt gate overlays it on merge-base product; a missing test is not a valid base failure."
    command: "if ! test -d node_modules; then npm ci --no-audit --no-fund || exit $?; fi; node node_modules/vitest/vitest.mjs run tests/identity/FieldIcon.omn21308.test.tsx src/lib/dashboard-colors.test.ts --maxWorkers=1 --no-file-parallelism"
  - kind: "tests"
    description: "Actual rendered Workflow model and passed/failed/unknown outcome icons, plus Without a tier in both themes. Full-page icon coverage is also recorded by the AC4 census; these focused cases do not by themselves prove every page."
    command: "if ! test -d node_modules; then npm ci --no-audit --no-fund || exit $?; fi; node node_modules/playwright/cli.js test tests/e2e/local-dashboard-omn21308-identities.spec.ts --project=chromium --workers=1 --retries=0 --trace=on"
  - kind: "tests"
    description: "Actual donut/legend/token-widget model colours with an unpriced model first, exact-ID case distinction, reorder stability and routing-model agreement in both themes. Current dev already fixed position-based priced-model indexing; retain those cases as positive controls and cite the genuine current-base failures separately."
    command: "if ! test -d node_modules; then npm ci --no-audit --no-fund || exit $?; fi; node node_modules/playwright/cli.js test tests/e2e/model-identity.omn21308.spec.ts --project=chromium --workers=1 --retries=0 --trace=on"
  - kind: "tests"
    description: "All eleven existing destinations at 1440x900 in light/dark with Developer off/on and expanded recorded content. Records actual SVG shapes and computed paint with visible labels; fails on unmapped semantic icons, inconsistent concept identities, duplicate icon/colour pairs, forged icon metadata and empty census. Explicit action/decoration classifications and raw non-icon graphic paints remain in the JSON. Fixture execution proves rendering, not a live producer or deployed build."
    command: "if ! test -d node_modules; then npm ci --no-audit --no-fund || exit $?; fi; source_sha=\"${OMNIDASH_TEST_SOURCE_SHA:-}\"; if [ -z \"$source_sha\" ]; then source_root=\"${OMNI_HOME:+$OMNI_HOME/omnidash}\"; source_sha=\"$(git -C \"${source_root:-.}\" rev-parse HEAD)\" || exit $?; fi; OMNIDASH_TEST_SOURCE_SHA=\"$source_sha\" node node_modules/playwright/cli.js test tests/e2e/local-dashboard-identity-census.omn21308.spec.ts --project=chromium --workers=1 --retries=0 --trace=on"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
