schema_version: "1.0.0"
ticket_id: "OMN-25104"
title: "The Overview page shows the Done figure from the served done items, never 0 for an unread, empty or unserved store"
summary: >-
  omnimarket's node_projection_done_items serves onex.snapshot.projection.done-items.v1, one row per done ticket
  (omnimarket#6418). ServedCountCard is the Done figure: the count of the served rows, computed from them alone,
  with Not measured and the reason when the read fails, serves no rows, or serves a row without its ticket, never 0.
  No omnidash code reads work_ledger_rows. The Overview page binds the card (overview-done) to done-items.v1 in a
  row under the headline cards; until the lab serves that exposure the card reads "Done items are not served yet."
  This contract proves the card's logic and its placement in the page; the live page read after the lab serves the
  exposure, and AC1 and AC2 in omnimarket, are outside it, so OMN-25104 must not close on it alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-done-figure"
    statement: "The Done card's figure is the count of rows in the served done-items projection, and no dashboard code reads a ledger table. Placing the card on the Overview page is a follow-up."
    acceptance:
      - id: "AC3"
        statement: >-
          AC3 (card logic part): the Done card's figure equals the count of rows in the served projection, shows Not measured
          with the reason for a failed or empty read, never 0, and no dashboard code reads work_ledger_rows
          -- falsifier: npx vitest run -t done_figure_from_served_projection, which fails on dev
          8c242112ca302691004579aded22417226c195bc because the card does not exist
evidence_requirements:
  - kind: "tests"
    description: "The Done figure tests."
    command: "npm test -- --run tests/pages/local/served-count-card.omn25104.test.tsx"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25104-ac3"
    description: >-
      AC3 in served-count-card.omn25104.test.tsx: three served rows read 3; a failed read and an empty read read Not
      measured with their reason, never 0; a row without a usable ticket among good rows reads Not measured; no source under src names work_ledger_rows. The file fails on dev
      8c242112ca302691004579aded22417226c195bc, where the card does not exist.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/pages/local/served-count-card.omn25104.test.tsx"
  - id: "dod-omn25104-ac3-overview"
    description: >-
      AC3 on the Overview page, in overview-done.omn25104.test.tsx: the Overview contract binds a metric_card
      overview-done to done-items.v1; the rendered page reads 3 for three served rows and 1 for one; a failed read
      shows Not measured with the read's reason (503); an empty read shows Not measured with "The read returned no
      rows."; a served row without its ticket shows Not measured with the missing-field reason, not a count; an
      exposure not served yet shows one Not measured and "Done items are not served yet."; none shows 0. The file
      fails on dev 3c179302459e172b575003a61a7d8a8314ab8eab, where the Overview page has no Done card.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/pages/local/overview-done.omn25104.test.tsx"
