schema_version: "1.0.0"
ticket_id: "OMN-26646"
title: "A run's answer and prompt render as safe markdown, with highlighted copyable code and token-coloured diagrams"
summary: >-
  Acceptance for OMN-26646. On the run page a model's answer and prompt render as formatted markdown with raw HTML
  switched off, fenced code is highlighted and copyable, and mermaid diagrams are drawn at strict security in the design
  tokens' colours. The seven criteria below follow the order of the approved spec's failure-mode list (AC1 markdown shown
  raw, AC2 injected markup, AC3 copy text, AC4 Raw and fold, AC5 prompt, AC6 colours, theme and a bad diagram, AC7 a
  mermaid label carrying a link or script); compared with the ticket text on 2026-11-25; the falsifier commands name
  this branch tests (F1 to F7) where the ticket names -t patterns.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26646-safe-markdown"
    statement: >-
      A run's answer and prompt render as markdown with raw HTML switched off, with highlighted copyable code blocks and
      mermaid diagrams drawn in the design tokens' colours.
    acceptance:
      - id: "AC1"
        statement: >-
          an answer's markdown (bold, an ordered list, a heading, a table) renders as elements with no markdown
          characters left -- falsifier: tests F1 in src/pages/local/answer-markdown.test.tsx and the playwright test
          "renders markdown"
      - id: "AC2"
        statement: >-
          script, img, iframe and javascript: link payloads in an answer create no element and stay visible as text;
          a link keeps an href only for http, https and mailto; an image is not rendered -- falsifier: tests F2 in
          src/pages/local/answer-markdown.test.tsx
      - id: "AC3"
        statement: >-
          a fenced code block shows its language and a copy button that copies exactly the code between the fences,
          highlighted without changing the text -- falsifier: tests F3 and the playwright test "code block shows its
          language, highlights, and copies only the code"
      - id: "AC4"
        statement: >-
          Raw shows the stored text character for character, Rendered is the default, and the fold sits outside the
          switch and works in both views -- falsifier: tests F4 in src/pages/local/answer-markdown.test.tsx
      - id: "AC5"
        statement: >-
          the prompt renders as markdown with the same protection and the same Rendered / Raw switch as the answer --
          falsifier: tests F5 in src/pages/local/answer-markdown.test.tsx
      - id: "AC6"
        statement: >-
          a mermaid diagram takes its colours from the design tokens read at draw time, is redrawn on a theme change,
          shows its source when a token cannot be read or the diagram does not parse, and never takes the page down;
          no colour value is written in the component source -- falsifier: tests F6 and the playwright tests
          "mermaid diagram is drawn in the design-token colours in both themes" and "mermaid diagram that fails to
          parse shows its source with a one-line note and leaves the page up"
      - id: "AC7"
        statement: >-
          mermaid is initialised at the strict security level with plain-text labels, loaded only for an answer that
          holds a diagram, and a label carrying a link, script or HTML adds none when drawn by real mermaid --
          falsifier: tests F7 and the playwright test "mermaid labels cannot add links, scripts or HTML when drawn
          with real mermaid"
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
