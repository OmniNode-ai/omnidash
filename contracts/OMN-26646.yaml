    description: >-
      AC1: the F1 vitest case and the playwright "renders markdown" test. At origin/dev the test files do not exist,
      so both fail there (no test found).
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "npm ci --prefer-offline --no-audit --no-fund && npx vitest run src/pages/local/answer-markdown.test.tsx -t \"F1:\" && npx playwright test tests/e2e/run-answer-markdown.spec.ts -g \"renders markdown\" --project=chromium --workers=1 --retries=0"
        cwd: "${OMNI_HOME}/omnidash"
