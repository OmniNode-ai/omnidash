requirements:
  - id: "req-omn24616-windows-and-served-lists"
    statement: >-
      Window totals count a day with no runs as zero, charts follow the served data with no fixed cap, and the pages
      keep no provider, tier, window or node-id list of their own.
    acceptance:
      - id: "AC1"
        statement: >-
          no local page computes a window figure from a partial page of rows; each comes from a served aggregate, or the
          page states how many runs it covers -- falsifier: npx vitest with 501 served decisions and a served aggregate
          fails unless Usage analysis and Overview's failure list show the served values
      - id: "AC3"
        statement: >-
          a window with days that have no runs shows zero for those days, not Unavailable, and every chart honours the
          selected window with no fixed 30-day cap -- falsifier: npx vitest with a 7-day window holding 2 days of runs
          fails unless the spend and savings tiles show values, and a 90-day window fails unless 90 days are plotted
      - id: "AC4"
        statement: >-
          the local pages hold no provider, tier, task-type, window or node-id list of their own; each comes from GET
          /models, the served rows or one contract-declared source -- falsifier: npx vitest serving a provider, a tier
          and a task type the code has never seen fails unless each renders by its served name, and a grep test fails
          on a provider-id or tier-id literal under src/pages/local
  - id: "req-omn24616-settings-price-and-status"
    statement: >-
      Settings shows the baseline price per million tokens, and provider status follows Refresh and the poll.
    acceptance:
      - id: "AC8"
        statement: >-
          Settings shows the baseline price itself, and provider status is re-read by Refresh and the poll like the
          keys table beside it -- falsifier: npx playwright test fails unless the price per million tokens is shown
          and a provider status change appears after Refresh
  - id: "req-omn24616-one-rate-scale"
    statement: >-
      Every rate on the local pages is held as a 0-1 share and written once as a percent, so a chart and its table
      read the same number.
    acceptance:
      - id: "AC6"
        statement: >-
          one formatter set serves every page: a missing value reads Not measured, durations, shares and money follow
          one rule each, every page header shows its Updated time, and Delegation Evidence uses the same components and
          loading and error wording as the other pages -- falsifier: npx playwright test over the six pages fails on a
          second spelling of a missing value, a page without an Updated time, or two precisions for one quantity
      - id: "AC2"
        statement: >-
          every rate is held on one scale and shown once as a percent, so Pass rate per day reads 80.6% in both chart
          and table -- falsifier: npx vitest rendering the table view of a 0.806 daily rate fails unless the cell
          reads 80.6%
  - id: "req-omn24616-served-reads-refuse-malformed-answers"
    statement: >-
      Every served response a local page reads is parsed, and a failed, refused or malformed read shows its reason and
      no figure.
    acceptance:
      - id: "AC5"
        statement: >-
          every served response a local page reads is parsed with a schema before use; a failed, refused or malformed
          read shows its reason and no figure, never Loading... or an empty success, and every local page sits in an
          error boundary that names the failure -- falsifier: npx vitest serving a malformed body and a refusal for
          each endpoint fails unless the page shows the reason, and npx playwright test opening
          /overview?window=constructor fails if the page goes blank
  - id: "req-omn24616-runs-export-and-way-back"
    statement: >-
      Runs export writes no cell a spreadsheet would run as a formula, and a run opened from Runs leads back to the
      same Runs view.
    acceptance:
      - id: "AC7"
        statement: >-
          Runs export neutralises cells that start with =, +, - or @, and a run opened from Runs shows a Runs
          breadcrumb and a back link to the same Runs view -- falsifier: npx vitest exporting =HYPERLINK(x) fails
          unless the cell is neutralised, and npx playwright test fails unless the back link returns to Runs
