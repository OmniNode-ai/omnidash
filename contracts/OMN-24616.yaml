schema_version: "1.0.0"
ticket_id: "OMN-24616"
title: "The local dashboard pages compute figures from partial reads, hard-code lists and show one value several ways"
summary: >-
  Acceptance for OMN-24616, copied from the live ticket on 2026-11-16. This pull request delivers AC1, AC3, AC4 and AC8. AC1: Usage reads every page of runs (decision D1) and Overview's
  failure list reads the quality gate's served counts.
  AC3: a day with no runs adds zero to a window total, and All time, custom-range and Usage charts span the served
  data with no 30-day cap. AC4: provider, tier and window lists come from one declared source outside the pages, an
  unknown key renders by its served name, and the local pages have no command palette (decision D3). AC8: Settings
  shows the baseline price itself, and the model provider status is re-read by Refresh and the poll. Each is declared
  here and bound to its tests. AC5 and
  AC7 are in the first pull request for this ticket, AC2 and AC6 in the second; whichever lands later merges the
  contracts.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn24616-windows-and-served-lists"
    statement: >-
      Window totals count a day with no runs as zero, charts follow the served data with no fixed cap, and the pages
      keep no provider, tier, window or node-id list of their own.
    acceptance:
      - id: "AC1"
        statement: >-
          no local page computes a window figure from a partial page of rows; each comes from a served aggregate, or the
          page states how many runs it covers -- falsifier: npx vitest with 501 served decisions and a served aggregate
          fails unless Usage analysis and Overview's failure list show the served values
      - id: "AC3"
        statement: >-
          a window with days that have no runs shows zero for those days, not Unavailable, and every chart honours the
          selected window with no fixed 30-day cap -- falsifier: npx vitest with a 7-day window holding 2 days of runs
          fails unless the spend and savings tiles show values, and a 90-day window fails unless 90 days are plotted
      - id: "AC4"
        statement: >-
          the local pages hold no provider, tier, task-type, window or node-id list of their own; each comes from GET
          /models, the served rows or one contract-declared source -- falsifier: npx vitest serving a provider, a tier
          and a task type the code has never seen fails unless each renders by its served name, and a grep test fails
          on a provider-id or tier-id literal under src/pages/local
  - id: "req-omn24616-settings-price-and-status"
    statement: >-
      Settings shows the baseline price per million tokens, and provider status follows Refresh and the poll.
    acceptance:
      - id: "AC8"
        statement: >-
          Settings shows the baseline price itself, and provider status is re-read by Refresh and the poll like the
          keys table beside it -- falsifier: npx playwright test fails unless the price per million tokens is shown
          and a provider status change appears after Refresh
evidence_requirements: []
