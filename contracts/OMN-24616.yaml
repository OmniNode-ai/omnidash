schema_version: "1.0.0"
ticket_id: "OMN-24616"
title: "The local dashboard pages compute figures from partial reads, hard-code lists and show one value several ways"
summary: >-
  Acceptance for OMN-24616, copied from the live ticket on 2026-11-16, for all eight criteria across three pull
  requests: the first (#517) delivers AC5 and AC7, the second (#518) AC2 and AC6, and this one AC1, AC3, AC4 and
  AC8. AC1: Usage reads every page of runs (decision D1) and Overview's failure list reads the quality gate's served
  counts. AC3: a day with no runs adds zero to a window total, and All time, custom-range and Usage charts span the
  served data with no 30-day cap. AC4: provider, tier and window lists come from one declared source outside the
  pages, an unknown key renders by its served name, and the local pages have no command palette (decision D3). AC8:
  Settings shows the baseline price itself, and the model provider status is re-read by Refresh and the poll. Each
  criterion is declared here and bound to its tests.
