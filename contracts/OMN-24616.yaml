schema_version: "1.0.0"
ticket_id: "OMN-24616"
title: "The local dashboard pages compute figures from partial reads, hard-code lists and show one value several ways"
summary: >-
  Acceptance for OMN-24616, copied from the live ticket on 2026-11-16. This pull request delivers AC5 and AC7 whole.
  AC5: the snapshot, projection, log-entry and model-provider reads each refuse a malformed answer with its reason
  instead of reading it as an empty success; Delegation Evidence and the provider table show that reason and no
  figure, never Loading or "recorded yet"; every local page sits in an error boundary; and a malformed window key is
  read as all time with the page kept up. AC7: Runs export neutralises formula cells, and a run opened from Runs has a Runs breadcrumb back to
  the same Runs view. Both are declared here and bound to their tests. AC1 to AC4, AC6 and AC8 follow in later pull
  requests for this ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn24616-served-reads-refuse-malformed-answers"
    statement: >-
      Every served response a local page reads is parsed, and a failed, refused or malformed read shows its reason and
      no figure.
    acceptance:
      - id: "AC5"
        statement: >-
          every served response a local page reads is parsed with a schema before use; a failed, refused or malformed
          read shows its reason and no figure, never Loading... or an empty success, and every local page sits in an
          error boundary that names the failure -- falsifier: npx vitest serving a malformed body and a refusal for
          each endpoint fails unless the page shows the reason, and npx playwright test opening
          /overview?window=constructor fails if the page goes blank
  - id: "req-omn24616-runs-export-and-way-back"
    statement: >-
      Runs export writes no cell a spreadsheet would run as a formula, and a run opened from Runs leads back to the
      same Runs view.
    acceptance:
      - id: "AC7"
        statement: >-
          Runs export neutralises cells that start with =, +, - or @, and a run opened from Runs shows a Runs
          breadcrumb and a back link to the same Runs view -- falsifier: npx vitest exporting =HYPERLINK(x) fails
          unless the cell is neutralised, and npx playwright test fails unless the back link returns to Runs
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
