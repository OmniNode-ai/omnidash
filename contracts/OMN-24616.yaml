    description: >-
      AC7 in three test files. csv-cell.test.ts and runs-sort-export.csv.test.ts export a served =HYPERLINK(x) and
      cells starting with +, - and @, and assert each is neutralised. runs-back-link.omn24616.test.tsx opens a run
      from a filtered Runs view and asserts the run address carries that view, the Workflow breadcrumb links Runs
      back to it, a crafted from parameter (another site, another page) is refused, and a run opened elsewhere shows
      no Runs crumb. Three of its four tests fail on dev d7278ead539f77122af0fcc83980e8bcd4bbac27.
    source: "manual"
    binds_ac: ["AC7"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run src/theme/format/csv-cell.test.ts src/pages/local/runs-sort-export.csv.test.ts src/navigation/runs-back-link.omn24616.test.tsx"
  - id: "dod-omn24616-ac7-e2e"
    description: >-
      AC7's falsifier in a browser: tests/e2e/runs-back.omn24616.spec.ts opens a run from a filtered Runs view and fails
      unless the Runs breadcrumb and the Back to Runs link both return to that same view, and a neighbouring run keeps
      the way back.
    source: "manual"
    binds_ac: ["AC7"]
    checks:
