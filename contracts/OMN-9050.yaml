schema_version: "1.0.0"
ticket_id: "OMN-9050"
title: "omnibase_core pin bump, Workflow run selection and schema compatibility core pin"
summary: >-
  Retain the dispatched omnibase_core pin and remove the Workflow run picker's
  passive draft reset. Key the picker by the requested run so a draft survives
  refreshes and resets when another run is selected. A regression test enters
  an id between commit and passive effects and verifies that it is submitted.
  Schema compatibility reads omnibase_core at the handshake's pin and fails
  when the two pins differ. check-handshake.yml is the only omnibase_core pin
  of the repository: the type-sync and schema compatibility workflows read it,
  so the pin-bump bot's one rewrite moves all three.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-core-pin"
    statement: "The handshake pins the dispatched omnibase_core commit and the type-sync workflow reads it."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: check-handshake.yml pins omnibase_core to one full commit SHA and
          type-sync-check.yml checks out omnibase_core at that pin through a
          resolver step, with no ref of its own.
  - id: "req-workflow-run-picker"
    statement: "The Workflow picker submits the entered run id without a deferred reset erasing it."
    acceptance:
      - id: "AC2"
        statement: >-
          AC2: an id entered between the form's commit and passive effects is
          retained and submitted; a refresh preserves an unfinished draft;
          changing the requested run resets the input; pasted ids open their
          own run with and without address synchronization.
  - id: "req-schema-compat-pin"
    statement: "The schema compatibility check reads the core commit pinned by the architecture handshake."
    acceptance:
      - id: "AC8"
        statement: >-
          onex-schema-compat.yml checks out omnibase_core at the immutable commit
          check-handshake.yml pins, through a resolver step, with no ref of its own.
  - id: "req-one-core-pin"
    statement: "check-handshake.yml is the only omnibase_core pin, so one bot rewrite moves every workflow."
    acceptance:
      - id: "AC9"
        statement: >-
          A test fails when any workflow other than check-handshake.yml checks
          out omnibase_core at a ref that is not a resolver step's output, and
          runs in the unconditional workflow-script-refs job and as a
          pre-commit hook.
  - id: "req-verified-checkout-pin-gate"
    statement: "The sibling pin gate distinguishes a proven SHA output from a live ref."
    acceptance:
      - id: "AC6"
        statement: >-
          The gate accepts a checkout consuming an earlier, uniquely identified
          same-job resolver whose complete command and Python AST validate one
          lowercase full commit SHA before emitting ref to GITHUB_OUTPUT.
      - id: "AC7"
        statement: >-
          Live refs, unknown expressions, changed guards or output writes,
          conditional producers, other-job or later producers, duplicate IDs
          and duplicate YAML keys remain rejected. The recognized resolver
          follows valid pin changes and refuses malformed or ambiguous inputs.
  - id: "req-schema-pin"
    statement: "Schema compatibility validates the same core commit as the handshake."
    acceptance:
      - id: "AC3"
        statement: >-
          The core checkout's ref is the resolver's output from
          check-handshake.yml; a guard step fails when
          the checked-out core differs from the handshake pin, and handshake
          edits trigger schema compatibility CI.
      - id: "AC4"
        statement: >-
          Resolution fails before writing a checkout ref when the handshake
          has no core checkout, multiple core checkouts, or a ref that is not
          a lowercase 40-character commit SHA.
evidence_requirements:
  - kind: "tests"
    description: "The handshake pins one commit and the type-sync workflow reads it."
    command: "uv run --no-project --python 3.12 --with pyyaml --with pytest python -m pytest tests/test_schema_compat_pin_omn9050.py -q --noconftest -p no:cacheprovider -c /dev/null -k 'declared_source or consumers_check_out'"
  - kind: "tests"
    description: "The picker retains early input and the Workflow page opens the selected run."
    command: "npm run test:run -- src/pages/LocalDashboardPage.run-picker.test.tsx src/pages/LocalDashboardPage.omn19987.workflow-page.test.tsx"
  - kind: "tests"
    description: "The workflow resolver and validation step run against real and planted inputs."
    command: "uv run --no-project --python 3.12 --with omnibase-core==0.47.38 --with omnibase-spi==0.23.5 --with pyyaml --with pytest python -m pytest tests/ci/test_schema_compat_core_owner_omn20885.py -q --noconftest -p no:cacheprovider -c /dev/null"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
