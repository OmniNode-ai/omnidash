  - id: "dod-omn21304-ac1-one-read-and-saved-data"
    description: >-
      AC1: one load and one refresh read the same set of exposures exactly once each; a failed refresh keeps the
      measured $0.70 on screen with its saved-data age and recovers; a first read that fails says unavailable and
      claims no saved data (control). Lab mutants on dev 890eb79a: removing the topic set and the in-flight read map
      fails the first case; dropping the last good rows on failure fails the second. Behaviour already on the base, so
      this binding uses the pinned gate's governed TEST_ONLY_DIFF path.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac12.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC1 one load and one refresh\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac12.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC1 a failed refresh keeps\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac12.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC1 a first read that fails\""
        cwd: "${OMNI_HOME}/omnidash"

  - id: "dod-omn21304-ac2-run-switch-and-phases"
    description: >-
      AC2: with run A's steps held, a switch to run B inside the app shows B (its model, no steps); when A answers,
      nothing of A appears; B's null queue wait and execution read Not recorded and its measured 0 duration reads
      0 ms; run A alone shows its steps (control). Lab mutant on dev 890eb79a: removing the current-load guards fails
      it. With run A's answer held too, B shows its own answer and none of A's, and going back to A shows A's steps,
      answer and model. The separate, unstacked, never-summed timings and their Not recorded and measured-zero states
      are the existing run-timing unit cases T1 to T6, and a run's cost taken only from the session with the same id
      (with a wrong session listed first, and a missing session) is the existing runs and provenance unit cases; both
      are bound here as well. Behaviour already on the base, so this
      binding uses the pinned gate's governed TEST_ONLY_DIFF path.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac12.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC2 a late answer\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac12.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC2 the same run read without a switch\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/pages/LocalDashboardPage.omn21015.run-timing.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "test -d node_modules || npm ci --no-audit --no-fund; npx vitest run src/pages/LocalDashboardPage.runs.test.tsx src/pages/LocalDashboardPage.provenance.test.tsx"
        cwd: "${OMNI_HOME}/omnidash"
