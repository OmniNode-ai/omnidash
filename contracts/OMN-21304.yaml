    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac3.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC3 no scored run\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
        check_value: "npm run test:e2e -- tests/e2e/local-dashboard-honesty-ac3.spec.ts --project=chromium --workers=1 --retries=0 --grep \"AC3 a served average score\""
        cwd: "${OMNI_HOME}/omnidash"
      - check_type: "test_passes"
