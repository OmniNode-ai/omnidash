  "requirements": [
    {
      "id": "req-transcribed-acceptance-criteria",
      "statement": "Acceptance criteria copied from the complete live ticket body on 2026-10-17. The ticket remains the source.",
      "acceptance": [
        {
          "id": "AC1",
          "statement": "AC1: (amended 2026-10-27: Jonah agreed in the team meeting, relayed by Lakshman) Primary navigation retains Overview, Runs, Workflow, Usage and Settings in that order, with working routes and an identifiable active page; Settings holds Model providers, Access and System status. Falsifier: a browser navigation walk cannot reach any core page or finds a reordered/missing entry."
        },
        {
          "id": "AC2",
          "statement": "AC2: Experimentation, Agent Workbench, Event Bus and Lab appear together in one Developer area controlled by an accessible setting, off for a fresh profile. Enabling it exposes all four working routes; disabling it hides their navigation entries. Existing feature implementations remain intact; this is a visibility preference, not an authorization boundary. Falsifier: a fresh-profile walk exposes those entries by default, or an enabled walk cannot reach one."
        },
        {
          "id": "AC3",
          "statement": "AC3: Default MVP UI contains no custom dashboard creation, widget-palette, widget-configuration or layout-editing affordance. Existing saved layouts and builder implementations are preserved. Falsifier: a six-page browser walk finds a builder entry point, or existing layout data is removed."
        },
        {
          "id": "AC4",
          "statement": "AC4: The AI assistant launcher and panel are absent from the default MVP surface, with its implementation preserved. Falsifier: the launcher/panel is reachable from the default app frame."
        },
        {
          "id": "AC5",
          "statement": "AC5: Cloud Keys is hidden in local-only mode while the rest of API Keys, including local identity/access information, remains available as served. Do not change behavior in other modes. Falsifier: a local-only browser capture shows Cloud Keys, or hides local identity/access information."
        },
        {
          "id": "AC6",
          "statement": "AC6: Delegation Evidence remains directly discoverable and accessible; its existing routing and quality evidence is preserved. Do not consolidate or hide it in this ticket. Falsifier: the default navigation loses its evidence entry or a regression walk cannot access existing evidence."
        },
        {
          "id": "AC7",
          "statement": "AC7: Existing Runs filters, selected-run links into Workflow, Usage views, theme switching and sidebar collapse continue to work. No new metric calculations or data paths. Falsifier: the before/after regression walk differs in these behaviors."
        },
        {
          "id": "AC8",
          "statement": "AC8: A repeatable browser verification artifact records the tested SHA, mode and viewport, Developer setting off/on, all six core pages and Delegation Evidence. Include missing-tenant and populated-tenant states, plus screenshots at 1440x900 and a narrow viewport. A missing populated capture remains explicitly unverified. Falsifier: any listed state lacks a capture or an existing required field becomes inaccessible."
        },
        {
          "id": "AC39",
          "statement": "AC39: No user-visible text on the six core pages or Delegation Evidence names an internal exposure, topic, table, column or typed code. Falsifier: the seven-page walk reports an internal name in populated, empty, unserved, refused, missing-table or missing-tenant states."
        },
        {
          "id": "AC48",
          "statement": "AC48: omnidash's repo-evidence caller pins the omnibase_core receipt gate that takes check-timeout-seconds and passes \"300\", so each evidence check, browser checks included, may run 300 s before it is stopped. Falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20073.py -q in omnidash fails at the merge base."
        },
        {
          "id": "AC49",
          "statement": "AC49: (approved plan amendment, 2026-10-24, Lakshman) at 1440x900 the Overview default page keeps the newest run's status, model and age within the first screen while AC44's basis line under Spend and Savings is visible (requirement Q2) -- falsifier: the bound check dod-omn21166-ac49-first-screen-fit in omnidash contracts/OMN-21166.yaml fails at the merge base"
        }
      ]
    },
    {
      "id": "req-mockup-parity-acceptance-criteria",
      "statement": "Mockup-parity acceptance criteria AC26, AC29, AC40 and AC42, copied from the approved plan's latest text (OMN-21166 amendments through part 6). The ticket and plan remain the source. AC27 and AC41 are proven only by browser specs, which the hosted control does not complete within its per-check budget, so they stay in the plan and not in this repo-owned acceptance list.",
      "acceptance": [
        {
          "id": "AC26",
          "statement": "AC26: Overview as in the mockup: headline pass rate with delta and interactive daily line; four KPI cards (paid, saved, runs, median duration) with deltas; runs-per-day (series toggles, hover/focus readout) and spend vs all-cloud (hover readout) charts; route-mix donut, activity heatmap, task mix, duration histogram, model scoreboard rings, cumulative savings; failure reasons and routes that filter the latest-runs table; time range (Today/7/14 days) applied to every panel; since-last-visit bar. Every figure traces to served rows; unavailable inputs show a typed unavailable state, never a fabricated value."
        },
        {
          "id": "AC29",
          "statement": "AC29: Usage as in the mockup: KPI cards, daily paid vs saved, tokens per day by model with model toggles, savings by route, spend-by-model donut, cost per run trend, tokens in vs out per model, models table."
        },
        {
          "id": "AC40",
          "statement": "AC40 (TI25): The activity insights on Overview and Runs offer the windows All, 1 day, 7 days, 15 days, 30 days and a custom UTC date range, and open on All. Each window counts only served rows whose time falls inside it. A custom range with its end before its start, or outside the served rows, shows a typed empty state, never a fabricated zero. Evidence:\n- vitest over a fixture with runs on known UTC days, with the clock pinned, for each preset and a custom range\n- the existing tests that expect the all-runs population (C9, C12, C13, contracts:213, contracts:448, omn21015:254) pass unchanged on the default\n- RED on `272e8556`, GREEN after"
        },
        {
          "id": "AC42",
          "statement": "AC42 (TI27): the Overview metering KPIs (spend and savings for the selected AC40 window) are visible in the open insights section, not inside a closed disclosure. Evidence: mockup-parity:50 unchanged and passing; it fails when the KPIs sit in a closed disclosure."
        },
        {
          "id": "AC44",
          "statement": "AC44: The headline cards show no Details disclosure. The facts it held that OMN-21304 AC4 requires (baseline model, pricing manifest version, unpriced-call count, and the runs a total leaves out, each or its typed not recorded state) appear as a short visible line under Spend and Savings; Modelled · vs cloud baseline and any fixture notice stay beside their figure."
        },
        {
          "id": "AC45",
          "statement": "AC45: The All calls and All-time aggregate captions are gone from the headline cards; the All time / Today switch still names the window and typed missing states remain."
        },
        {
          "id": "AC46",
          "statement": "AC46: The run breakdown shows measured, estimated and unknown as separate labelled counts, each in its own semantic colour from the shared identity (OMN-21308) in both themes; unknown means no measurement, never a failed run, and colour never carries meaning alone."
        },
        {
          "id": "AC47",
          "statement": "AC47: Under Tokens processed, input and output show only from fields the Overview aggregate itself serves for the same tenant, window and population as its tokens_total; a missing direction reads Not measured and nothing is borrowed from delegation.token-usage."
        }
      ]
