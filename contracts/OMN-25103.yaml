schema_version: "1.0.0"
ticket_id: "OMN-25103"
title: "The Overview Running figure counts the served rows marked running, never 0 for an unread or empty store"
summary: >-
  omnimarket's node_projection_floor_integration serves onex.snapshot.projection.floor-integration-rows.v1, one row
  per merged change with its state, from each hourly integration pass (omnimarket#6420). runningRowsCount is the
  Running figure: the number of served rows whose state is running, computed from them alone. Served rows with none
  running are a measured 0; a failed read, an empty read or a row without its state shows Not measured with the
  reason, never 0. Binding the card on the Overview page follows once the lab serves the exposure, because the pages
  bind only exposures the captured lab catalogue marks ok.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-running-figure"
    statement: "The dashboard's Running figure is the count of served floor-integration rows marked running."
    acceptance:
      - id: "AC2"
        statement: >-
          AC2: the dashboard's Running figure equals the count of rows the served projection marks running, with no
          list or count of its own -- falsifier: npx vitest run -t running_figure_from_served_projection, which
          fails on dev 8c242112ca302691004579aded22417226c195bc because the count does not exist
      - id: "AC3"
        statement: >-
          AC3: a failed or empty read shows Not measured with the reason, never 0 -- falsifier: npx vitest run -t
          running_figure_unavailable, which fails on dev 8c242112ca302691004579aded22417226c195bc
evidence_requirements:
  - kind: "tests"
    description: "The Running figure tests."
    command: "npm test -- --run src/pages/local/served-count-card.omn25103.test.tsx"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25103-ac2"
    description: >-
      AC2 in served-count-card.omn25103.test.tsx: four served rows, two running, read 2; served rows with none
      running read a measured 0. Both fail where runningRowsCount does not exist.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run src/pages/local/served-count-card.omn25103.test.tsx -t running_figure_from_served_projection"
  - id: "dod-omn25103-ac3"
    description: >-
      AC3 in served-count-card.omn25103.test.tsx: a failed read and an empty read read Not measured, the failed one
      with its reason, never 0; a row without its state reads Not measured rather than a partial count.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run src/pages/local/served-count-card.omn25103.test.tsx -t running_figure_unavailable"
