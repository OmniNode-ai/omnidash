schema_version: "1.0.0"
ticket_id: "OMN-25103"
title: "The Overview page shows the Running figure from the served rows marked running, never 0 for an unread, empty or unserved store"
summary: >-
  omnimarket's node_projection_floor_integration serves onex.snapshot.projection.floor-integration-rows.v1, one row
  per merged change with its state, from each hourly integration pass (omnimarket#6420). runningRowsCount is the
  Running figure: the number of served rows whose state is running, computed from them alone. Served rows with none
  running are a measured 0; a failed read, an empty read or a row without its state shows Not measured with the
  reason, never 0. The Overview page binds the card (overview-running) to floor-integration-rows.v1 beside the Done
  card, under the headline cards; until the lab serves that exposure the card reads "Running changes are not served
  yet." This contract proves the card's logic and its placement in the page; the live page read after the lab serves
  the exposure, and AC1, AC4 and AC5 in other repositories, are outside it, so OMN-25103 must not close on it alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-running-figure"
    statement: "The Running card's figure is the count of served floor-integration rows marked running. Placing the card on the Overview page is a follow-up."
    acceptance:
      - id: "AC2"
        statement: >-
          AC2 (card logic part): the Running card's figure equals the count of rows the served projection marks running, with no
          list or count of its own -- falsifier: npx vitest run -t running_figure_from_served_projection, which
          fails on dev 8c242112ca302691004579aded22417226c195bc because the count does not exist
      - id: "AC3"
        statement: >-
          AC3 (card logic part): a failed or empty read shows Not measured with the reason, never 0 -- falsifier: npx vitest run -t
          running_figure_unavailable, which fails on dev 8c242112ca302691004579aded22417226c195bc
evidence_requirements:
  - kind: "tests"
    description: "The Running figure tests."
    command: "npm test -- --run tests/pages/local/served-count-card.omn25103.test.tsx"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25103-ac2"
    description: >-
      AC2 in served-count-card.omn25103.test.tsx: four served rows, two running, read 2; served rows with none
      running read a measured 0. Both fail where runningRowsCount does not exist.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/pages/local/served-count-card.omn25103.test.tsx -t running_figure_from_served_projection"
  - id: "dod-omn25103-ac3"
    description: >-
      AC3 in served-count-card.omn25103.test.tsx: a failed read and an empty read read Not measured, the failed one
      with its reason, never 0; a row without its state reads Not measured rather than a partial count.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/pages/local/served-count-card.omn25103.test.tsx -t running_figure_unavailable"
  - id: "dod-omn25103-ac2-overview"
    description: >-
      AC2 on the Overview page, in overview-running.omn25103.test.tsx: the Overview contract binds a metric_card
      overview-running to floor-integration-rows.v1; the rendered page reads 3 for four served rows with three running
      and 1 for two rows with one running; served rows with none running read a measured 0. The file fails on omnidash
      dev 505e5758f7222fa696cdf5011a2d6bce68515b42, where the Overview page has no Running card.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/pages/local/overview-running.omn25103.test.tsx -t running_figure_from_served_projection"
        cwd: "${OMNI_HOME}/omnidash"
  - id: "dod-omn25103-ac3-overview"
    description: >-
      AC3 on the Overview page, in the same file: a failed read shows Not measured with the read's reason (503); an
      empty read shows Not measured with "The read returned no rows."; a served row without its state shows Not
      measured with the missing-field reason, not a partial count; an exposure not served yet shows one Not measured
      and "Running changes are not served yet."; none shows 0.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "npm test -- --run tests/pages/local/overview-running.omn25103.test.tsx -t running_figure_unavailable"
        cwd: "${OMNI_HOME}/omnidash"
