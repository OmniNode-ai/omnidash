{
  "components": [
    {
      "component_id": "recent-runs",
      "component_kind": "table",
      "title": "Recent runs",
      "contract_version": { "major": 1, "minor": 0, "patch": 0 },
      "data_bindings": [
        {
          "binding_id": "runs-snapshot",
          "projection_topic": "onex.snapshot.projection.delegation.savings.v1",
          "ordering_authority_field": "created_at",
          "ordering_direction": "descending",
          "required_fields": [
            "sessions",
            "session_id",
            "created_at",
            "model_name",
            "prompt_tokens",
            "completion_tokens",
            "local_cost_usd",
            "cloud_cost_usd",
            "counterfactual_baseline_usd",
            "baseline_model",
            "savings_usd",
            "usage_source",
            "savings_method",
            "task_type",
            "latency_ms",
            "tokens_to_compliance"
          ]
        },
        {
          "binding_id": "runs-decisions",
          "projection_topic": "onex.snapshot.projection.delegation.decisions.v1",
          "ordering_authority_field": "written_at",
          "ordering_direction": "descending",
          "required_fields": [
            "correlation_id",
            "quality_gate_passed",
            "quality_gate_detail",
            "cost_tier_name",
            "actual_score"
          ]
        }
      ],
      "supported_empty_state_reasons": ["missing-field", "no-data"]
    }
  ],
  "page_empty_state_reasons": ["NO_RUNS_YET", "BASELINE_UNRESOLVED"]
}
