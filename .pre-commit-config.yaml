---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^src/registry/component-registry\.json$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: no-env-file
        name: Reject committed .env files (except .env.example)
        entry: >-
          bash -c 'FILES=$(git diff --cached --name-only | grep -E "(^|/)\.env([._-].+)?$" |
          grep -vE "\.env\.example"); [ -n "$FILES" ] &&
          { echo "BLOCKED: .env staged - use ~/.omnibase/.env instead. Run: git reset HEAD <file>"; exit 1; } ||
          true'
        language: system
        pass_filenames: false
        always_run: true

      - id: no-planning-docs
        name: Block planning docs (belong in omni_home/docs/plans/)
        entry: >-
          bash -c 'PLAN_FILES=$(git diff --cached --diff-filter=AM --name-only -- "docs/plans/");
          if [ -n "$PLAN_FILES" ]; then
          echo "ERROR: Planning docs must live in omni_home/docs/plans/, not in this repo:";
          echo "$PLAN_FILES"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: env-contamination-grep
        name: Block hardcoded URLs/IPs/paths
        entry: bash scripts/check-no-env-contamination.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: delegation-refs-check
        name: Block hardcoded delegation refs in browser bundle
        entry: bash scripts/check-hardcoded-delegation-refs.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: eslint
        name: ESLint (changed JS/TS files)
        entry: ./node_modules/.bin/eslint --fix
        language: system
        files: \.(js|jsx|ts|tsx)$

      - id: tsc-typecheck
        name: TypeScript typecheck
        entry: ./node_modules/.bin/tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: normalization-symmetry
        name: normalization-symmetry
        entry: bash -c 'PYTHONPATH="${OMNIBASE_CORE_PATH:-../omnibase_core}/src" uv run --project "${OMNIBASE_CORE_PATH:-../omnibase_core}" python -m omnibase_core.validation.checker_normalization_symmetry'
        language: system
        pass_filenames: false
      # OMN-15241: Required-Check Skip-Vector Guard (canary OMN-14854) -- LOCAL
      # parity for a guard this repo already runs CI-only via
      # .github/workflows/required-check-skip-guard-caller.yml. Without this hook a
      # skip-vector violation commits with every local hook GREEN and is caught only
      # after push -- detection without local enforcement (root CLAUDE.md Rule #5).
      #
      # Fails closed when a workflow file or the required-checks manifest introduces
      # any of the five skip vectors on a REQUIRED context: a path-scoped trigger, an
      # ungated job-level `if:`, an ungated reusable-caller `if:`, a missing
      # pull_request/merge_group trigger, or a `needs:` with no `if:` that provably
      # runs regardless of the needs result (OMN-15057 vector 5).
      #
      # The wrapper executes the SAME validator the CI reusable workflow executes
      # (canonical copy in omniclaude, resolved via $OMNI_HOME), so local and CI
      # verdicts cannot diverge on validator logic.
      - id: reject-required-check-skip-vector
        name: Reject skip vectors on required-check workflows (OMN-15241)
        entry: .pre-commit-hooks/reject-required-check-skip-vector.sh
        language: script
        pass_filenames: false
        files: '^\.github/(workflows/.*\.ya?ml|required-checks\.yaml)$'
        stages: [pre-commit]
