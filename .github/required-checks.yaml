# required-checks.yaml v3 (OMN-14860, fan-out from the omniclaude canary
# OMN-14854; branch-scoped coverage added OMN-15120, per-branch `branch:`
# field schema OMN-15117)
# Location: .github/required-checks.yaml
# This file is the OPERATIONAL input to the Required-Check Skip-Vector Guard
# (validate_no_required_check_skip_vectors.py, canonical source in
# OmniNode-ai/omniclaude), invoked here via
# required-check-skip-guard-reusable.yml@main.
#
# Exhaustive for BOTH branches (OMN-15120 — omnidash had no `main`-branch
# manifest coverage prior to this PR; live readback 2026-07-25 via
# `gh api repos/OmniNode-ai/omnidash/branches/{dev,main}/protection/required_status_checks`):
#   - `dev`: 22 required contexts, unchanged from the 2026-07-20 authoring
#     pass, still 100% covered.
#   - `main`: 17 required contexts, a strict subset of dev's 22 — the 5 rows
#     below that carry an explicit `branch: dev` field (`Tenant RLS
#     Isolation`, `TypeScript ↔ Python Type Sync`, `occ-preflight /
#     eligibility`, `receipt-honesty`, `verify / verify`) are required on
#     `dev` only and were NOT live-required on `main` as of 2026-07-25. A
#     REQUIRED row with no `branch:` field is required on BOTH branches
#     (unchanged legacy convention; matches the omnimarket OMN-15120 canary,
#     PR #1895). Plus one `mode: ADVISORY` row for this guard's own composed
#     context (see rationale on that row for why it is not yet REQUIRED).
#
# Post-reconcile verification: `reconcile_manifest_vs_live.py --repo
# OmniNode-ai/omnidash --branch dev` and `--branch main` both return PASS
# (empty diff in both directions) — see PR body for full command output.
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so a privileged reconcile job (not yet wired for
# omnidash — see follow-up note below) never observes a divergence window.
#
# Field shapes:
#   producer_kind: local      + workflow + job_path            -> Shape A
#                                                                  (direct job
#                                                                  in this
#                                                                  repo)
#   producer_kind: local      + caller_workflow/caller_job +
#                               reusable_workflow/reusable_job  -> Shape B
#                                                                  (local
#                                                                  caller ->
#                                                                  local
#                                                                  reusable)
#   producer_kind: cross_repo + caller_workflow/caller_job +
#                               cross_repo_ref                  -> Shape C
#                                                                  (local
#                                                                  caller ->
#                                                                  reusable
#                                                                  workflow
#                                                                  hosted in
#                                                                  another
#                                                                  repo; only
#                                                                  the caller
#                                                                  side is
#                                                                  checkable
#                                                                  from this
#                                                                  repo)
#
# Open follow-up (not resolved in this PR): `required-check-manifest-reconcile.yml`
# (the privileged push/schedule job that diffs this manifest against LIVE
# branch protection) has not been ported to omnidash yet — it needs its own
# `administration:read`-scoped PAT provisioned as a repo secret first, exactly
# as noted in the omniclaude canary. Tracked as a follow-up, not this ticket's
# scope (OMN-14860).

schema_version: 3
classification: dashboard
repo: omnidash

gates:
  - name: "Typecheck & Tests"
    mode: REQUIRED
    producer_kind: local
    workflow: ci.yml
    job_path: ["test"]
    skip_semantics: never
    rationale: "Live required status check on omnidash dev branch protection."

  - name: "golden-chain"
    mode: REQUIRED
