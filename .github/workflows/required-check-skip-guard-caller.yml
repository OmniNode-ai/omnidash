#
# Required-Check Skip-Vector Guard — caller (OMN-14860; fan-out from the
# omniclaude canary, OMN-14854). Invokes the canonical reusable validator
# hosted in omniclaude on every PR to omnidash; produces the composed status
# context "required-check-skip-guard / check-skip-vectors".
#
# NOT YET added to required_status_checks on this repo's dev/main branches in
# this PR — per the canary's rollout ordering (design spec section 5), the
# branch-protection flip happens only after the composed context has posted
# green on `dev` at least twice, tracked as a follow-up ticket. This repo's
# .github/required-checks.yaml row for this context carries `mode: ADVISORY`
# until that flip lands (same PR as the flip, per schema-v3 convention).
#
# IMPORTANT: this trigger MUST NOT carry a `paths:`/`paths-ignore:` filter
# (design spec section 4c) — a path filter here would be the exact
# self-referential skip-vector this guard exists to catch. This is the one
# required-check workflow that is exempt from "narrow the trigger for
# efficiency". A `branches:` filter (no paths) mirrors every other cross-repo
# caller already in this repo (call-occ-preflight.yml, call-receipt-gate.yml,
# call-reject-skip.yml) and is not itself a skip vector — the validator only
# flags `paths`/`paths-ignore`.

name: Required-Check Skip-Vector Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev, "hotfix/**"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  required-check-skip-guard:
    uses: OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@main
