name: docs-validate

on:
  pull_request:
  push:
    branches: [main, "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  call:
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@1e69bec909f245be511803191554e5b340def0b7  # omnibase_core main as of 2026-10-02 (OMN-20332)
    with:
      standalone: true
