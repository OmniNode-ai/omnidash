#
# Repo Evidence Gate caller (OMN-20073, OCC retirement OR.5, epic OMN-20068)
# verifies omnidash's own contracts/<OMN-N>.yaml at the PR head through
# omnibase_core's receipt-gate reusable with evidence-source: caller. This is
# the path omnimarket proved as the canary (OMN-20070, OMN-20072).
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# verifier-version pins the released verifier used to read the caller's contracts.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name. The reusable also reports a
# repo-evidence / verify job in this mode (the OCC path, switched off by the
# input); only repo-evidence / dod-verify carries a verdict.
#
# OMN-20074 S6 cut-over: this caller enforces repo-owned evidence with shadow
# "false". Admission no longer compares with OCC (compare-with-occ "false");
# rollback is setting compare-with-occ back to "true".
# repo-evidence / dod-verify is to be required by a dev ruleset, with no row in
# required-checks.yaml. CI Summary (ci.yml) judges only its own needs, test and
# tenant-rls, so it does not judge this external context.
#
# The reusable is pinned by full SHA to omnibase_core#1932's squash commit on
# dev, the pin omnibase_infra, omnimarket and omniclaude callers use.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa # OMN-20074: immutable full-SHA pin, omnibase_core#1932 squash on dev
    with:
      evidence-source: caller
      verifier-version: 0.4.310
      compare-with-occ: "false"
      shadow: "false"
