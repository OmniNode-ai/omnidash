#
# CodeQL security and quality analysis for omnidash.
# omnidash is a Vite/React TypeScript app — uses javascript-typescript language.
# Calls the reusable workflow in onex_change_control.
#
# Do NOT add `continue-on-error` to the `codeql` job. GitHub forbids that key on
# a job that calls a reusable workflow with `uses:`; adding it makes the whole
# file unparseable, so every run becomes a startup_failure that creates no job
# and no check run — the analysis silently stops instead of being "tolerated".
# That is exactly what happened between 2026-04-28 and OMN-17179.
#
# OMN-5426, OMN-17179

name: Security Scan

on:
  push:
    branches: [main, dev, "hotfix/**"]
  pull_request:
    branches: [main, dev, "hotfix/**"]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  codeql:
    name: CodeQL
    uses: OmniNode-ai/onex_change_control/.github/workflows/codeql-reusable.yml@main
    with:
      language: javascript-typescript
      query_suite: security-and-quality
    permissions:
      actions: read
      contents: read
      security-events: write
