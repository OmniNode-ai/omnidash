#
# OMN-12243: Block PRs targeting main.
# OMN-12477: Removed the hotfix/* bypass.
#
# OMN-20074: no exception is left. main is release-synced: release.yml
# ("Sync main to release tag") fast-forwards it to the released tag over the
# REST API and opens no pull request against it. The promotion-receipt line
# this guard used to admit named a change-control receipt id that nothing
# mints any more, so every PR that targets main is refused and retargeted to
# dev. The `edited` type stays: a PR retargeted to main fires it.
# Pinned by tests/ci/test_occ_off_omn20074.py.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-target-guard:
    name: main-target-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "::error::PR from '${HEAD_REF}' targets main, which is release-synced and never a pull-request target."
          echo "::error::release.yml moves main by fast-forwarding it to the released tag; it opens no PR against main."
          echo "::error::Retarget this PR to dev."
          exit 1
